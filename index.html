<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kenier Barber Studio | Reservas</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f5f5f5;
  color: #111;
}

.container {
  width: min(92%, 480px);
  margin: auto;
  padding: 30px 0 40px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 24px;
  box-shadow: 0 4px 20px rgba(0,0,0,.08);
}

h1 {
  margin: 0;
  font-size: 28px;
}

.subtitle {
  margin: 6px 0 25px;
  color: #666;
}

label {
  display: block;
  font-weight: bold;
  margin: 18px 0 8px;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
  background: white;
}

.times {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
}

.time {
  border: 1px solid #ddd;
  background: white;
  color: #111;
  padding: 13px 5px;
  border-radius: 10px;
  font-size: 14px;
  cursor: pointer;
}

.time.selected {
  background: #111;
  color: white;
  border-color: #111;
}

.time.disabled {
  background: #eee;
  color: #aaa;
  text-decoration: line-through;
  cursor: not-allowed;
}

.selected-info {
  margin-top: 15px;
  padding: 12px;
  background: #f1f1f1;
  border-radius: 10px;
  text-align: center;
}

button.reserve {
  width: 100%;
  margin-top: 24px;
  padding: 16px;
  border: 0;
  border-radius: 12px;
  background: #111;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button.reserve:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.message {
  margin-top: 18px;
  padding: 16px;
  border-radius: 10px;
  text-align: center;
  font-weight: bold;
  line-height: 1.5;
}

.message.success {
  display: block;
  background: #e8f7e8;
  color: #176117;
}

.message.error {
  display: block;
  background: #ffe9e9;
  color: #8a1111;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">

    <h1>Kenier Barber Studio</h1>

    <div class="subtitle">
      Reserva tu cita
    </div>

    <label for="date">
      Selecciona el día
    </label>

    <input
      type="date"
      id="date"
    >

    <label>
      Selecciona la hora
    </label>

    <div
      class="times"
      id="times"
    ></div>

    <div
      class="selected-info"
      id="selectedInfo"
    >
      Selecciona una hora
    </div>

    <label for="name">
      Tu nombre
    </label>

    <input
      type="text"
      id="name"
      placeholder="Nombre completo"
    >

    <label for="phone">
      Teléfono
    </label>

    <input
      type="tel"
      id="phone"
      placeholder="Número de teléfono"
    >

    <button
      class="reserve"
      id="reserve"
      disabled
    >
      Reservar cita
    </button>

    <div
      id="message"
      class="hidden"
    ></div>

  </div>
</div>


<script>

const times = [
  "08:00",
  "09:00",
  "10:00",
  "11:00",
  "12:00",
  "13:00",
  "14:00",
  "15:00",
  "16:00",
  "17:00",
  "18:00"
];


const dateInput =
  document.getElementById("date");

const timesContainer =
  document.getElementById("times");

const selectedInfo =
  document.getElementById("selectedInfo");

const nameInput =
  document.getElementById("name");

const phoneInput =
  document.getElementById("phone");

const reserveButton =
  document.getElementById("reserve");

const message =
  document.getElementById("message");


let selectedTime = null;


/* FECHA DE HOY */

function getToday() {

  const now = new Date();

  const year =
    now.getFullYear();

  const month =
    String(now.getMonth() + 1)
      .padStart(2, "0");

  const day =
    String(now.getDate())
      .padStart(2, "0");

  return `${year}-${month}-${day}`;
}


dateInput.min = getToday();

dateInput.value = getToday();


/* FORMATO DE HORA */

function formatTime(time) {

  const hour =
    Number(time.split(":")[0]);

  if (hour === 12) {
    return "12:00 PM";
  }

  if (hour > 12) {
    return `${hour - 12}:00 PM`;
  }

  return `${hour}:00 AM`;
}


/* MOSTRAR HORARIOS */

function renderTimes(booked = []) {

  selectedTime = null;

  selectedInfo.textContent =
    "Selecciona una hora";

  reserveButton.disabled = true;

  timesContainer.innerHTML = "";


  times.forEach(time => {

    const button =
      document.createElement("button");

    button.type = "button";

    button.className = "time";

    button.textContent =
      formatTime(time);


    if (booked.includes(time)) {

      button.classList.add("disabled");

      button.disabled = true;

    } else {

      button.addEventListener(
        "click",
        () => {

          selectTime(
            time,
            button
          );

        }
      );

    }

    timesContainer.appendChild(button);

  });

}


/* SELECCIONAR HORA */

function selectTime(time, button) {

  document
    .querySelectorAll(".time")
    .forEach(btn => {

      btn.classList.remove(
        "selected"
      );

    });


  button.classList.add(
    "selected"
  );


  selectedTime = time;


  selectedInfo.textContent =
    `Hora seleccionada: ${formatTime(time)}`;


  validateForm();

}


/* VALIDAR */

function validateForm() {

  const valid =
    selectedTime !== null &&
    nameInput.value.trim() !== "" &&
    phoneInput.value.trim() !== "";

  reserveButton.disabled =
    !valid;

}


/* CARGAR CITAS */

async function loadAppointments() {

  renderTimes([]);


  try {

    const response =
      await fetch(
        `/api/appointments?date=${encodeURIComponent(dateInput.value)}`
      );


    if (!response.ok) {
      return;
    }


    const data =
      await response.json();


    const booked =
      (data.appointments || [])
        .map(
          appointment =>
            appointment.appointment_time
        );


    renderTimes(booked);

  } catch (error) {

    console.log(
      "API no disponible:",
      error
    );

  }

}


/* MOSTRAR MENSAJE */

function showMessage(text, type) {

  message.textContent = text;

  message.className =
    `message ${type}`;

}


/* RESERVAR */

async function reserveAppointment() {

  if (
    !selectedTime ||
    !nameInput.value.trim() ||
    !phoneInput.value.trim()
  ) {
    return;
  }


  reserveButton.disabled = true;

  reserveButton.textContent =
    "Reservando...";


  message.className =
    "hidden";

  message.textContent =
    "";


  try {

    const response =
      await fetch(
        "/api/appointments",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            date:
              dateInput.value,

            time:
              selectedTime,

            name:
              nameInput.value.trim(),

            phone:
              phoneInput.value.trim()

          })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "No se pudo reservar la cita."
      );

    }


    /*
      CITA CONFIRMADA
    */

    const bookedTime =
      formatTime(selectedTime);


    showMessage(
      `✅ ¡Cita reservada correctamente!<br>📅 ${dateInput.value}<br>🕐 ${bookedTime}<br>👤 ${nameInput.value.trim()}`,
      "success"
    );


    nameInput.value = "";

    phoneInput.value = "";


    selectedTime = null;


    selectedInfo.textContent =
      "Cita confirmada";


    /*
      Actualizar horarios
    */

    await loadAppointments();


  } catch (error) {

    showMessage(
      `❌ ${error.message}`,
      "error"
    );


    await loadAppointments();

  }


  reserveButton.textContent =
    "Reservar cita";


  validateForm();

}


/* EVENTOS */

dateInput.addEventListener(
  "change",
  loadAppointments
);


nameInput.addEventListener(
  "input",
  validateForm
);


phoneInput.addEventListener(
  "input",
  validateForm
);


reserveButton.addEventListener(
  "click",
  reserveAppointment
);


/* INICIAR */

renderTimes([]);

loadAppointments();

</script>

</body>
</html>
