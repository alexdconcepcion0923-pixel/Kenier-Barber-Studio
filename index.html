<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Kenier Barber Studio</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      margin: 0;
      padding: 0;
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f4f4f4;
      color: #111;
    }


    /* =========================
       HEADER
    ========================= */

    .header {
      background: #111;
      color: white;

      padding:
        20px
        15px;

      text-align: center;

      box-shadow:
        0 4px 18px
        rgba(0,0,0,.12);
    }


    .header h1 {
      margin: 0;

      font-size: 27px;

      font-weight: 800;

      letter-spacing: .2px;
    }


    .header p {
      margin:
        6px
        0
        0;

      font-size: 11px;

      letter-spacing: 3px;

      opacity: .7;
    }


    /* =========================
       CONTENEDOR
    ========================= */

    .container {
      width:
        min(
          700px,
          calc(100% - 20px)
        );

      margin:
        15px
        auto
        35px;
    }


    /* =========================
       TARJETAS
    ========================= */

    .card {
      background: white;

      border-radius: 16px;

      padding: 17px;

      margin-bottom: 11px;

      border:
        1px solid
        #e8e8e8;

      box-shadow:
        0 4px 15px
        rgba(0,0,0,.055);
    }


    .section-title {
      display: flex;

      align-items: center;

      gap: 10px;

      margin-bottom: 12px;
    }


    .number {
      width: 29px;
      height: 29px;

      min-width: 29px;

      border-radius: 50%;

      background: #111;

      color: white;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 13px;

      font-weight: 800;
    }


    .section-title h2 {
      margin: 0;

      font-size: 17px;
    }


    .description {
      margin:
        -3px
        0
        12px
        39px;

      color: #666;

      font-size: 12px;

      line-height: 1.4;
    }


    /* =========================
       DROPDOWNS
    ========================= */

    .dropdown {
      position: relative;
      width: 100%;
    }


    .dropdown-button {
      width: 100%;

      height: 48px;

      border:
        1.5px
        solid
        #ddd;

      background: white;

      border-radius: 11px;

      padding:
        0
        13px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      cursor: pointer;

      transition:
        .2s ease;

      font-size: 14px;

      color: #111;

      text-align: left;
    }


    .dropdown-button:hover {
      border-color: #111;

      box-shadow:
        0 4px 12px
        rgba(0,0,0,.07);
    }


    .dropdown-button.active {
      border-color: #111;

      border-radius:
        11px
        11px
        0
        0;
    }


    .dropdown-left {
      display: flex;

      align-items: center;

      gap: 9px;

      min-width: 0;
    }


    .dropdown-icon {
      font-size: 17px;
    }


    .dropdown-arrow {
      font-size: 17px;

      transition:
        transform
        .2s ease;
    }


    .dropdown-button.active
    .dropdown-arrow {
      transform:
        rotate(180deg);
    }


    .dropdown-menu {
      position: absolute;

      z-index: 100;

      top: 47px;

      left: 0;

      width: 100%;

      background: white;

      border:
        1.5px
        solid
        #111;

      border-top: none;

      border-radius:
        0
        0
        11px
        11px;

      overflow: hidden;

      display: none;

      box-shadow:
        0 12px 25px
        rgba(0,0,0,.13);
    }


    .dropdown-menu.open {
      display: block;

      animation:
        dropdownIn
        .15s
        ease;
    }


    @keyframes dropdownIn {

      from {
        opacity: 0;

        transform:
          translateY(-4px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);
      }

    }


    /* =========================
       SERVICIOS
    ========================= */

    .service-item,
    .time-item {
      width: 100%;

      border: none;

      border-bottom:
        1px
        solid
        #eee;

      background: white;

      padding:
        12px
        13px;

      cursor: pointer;

      text-align: left;

      transition:
        .18s ease;

      color: #111;
    }


    .service-item:last-child,
    .time-item:last-child {
      border-bottom: none;
    }


    .service-item:hover,
    .time-item:hover {
      background: #f2f2f2;

      padding-left: 18px;
    }


    .service-item.selected,
    .time-item.selected {
      background: #111;

      color: white;
    }


    .service-main {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;
    }


    .service-name {
      font-size: 13px;

      font-weight: 700;
    }


    .service-price {
      font-size: 13px;

      font-weight: 800;

      white-space: nowrap;
    }


    .service-sub {
      margin-top: 3px;

      font-size: 11px;

      color: #777;
    }


    .service-item.selected
    .service-sub {
      color: #ccc;
    }


    /* =========================
       FECHA
    ========================= */

    .date-input {
      width: 100%;

      height: 48px;

      padding:
        0
        13px;

      border:
        1.5px
        solid
        #ddd;

      border-radius: 11px;

      background: white;

      color: #111;

      font-size: 14px;

      outline: none;

      transition:
        .2s ease;
    }


    .date-input:hover {
      border-color: #999;
    }


    .date-input:focus {
      border-color: #111;

      box-shadow:
        0 0 0 3px
        rgba(0,0,0,.06);
    }


    /* =========================
       INPUTS
    ========================= */

    .data-grid {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 9px;
    }


    .input-label {
      display: block;

      margin-bottom: 6px;

      font-size: 12px;

      font-weight: 700;
    }


    .text-input {
      width: 100%;

      height: 47px;

      padding:
        0
        13px;

      border:
        1.5px
        solid
        #ddd;

      border-radius: 11px;

      font-size: 14px;

      outline: none;

      transition:
        .2s ease;
    }


    .text-input:hover {
      border-color: #999;
    }


    .text-input:focus {
      border-color: #111;

      box-shadow:
        0 0 0 3px
        rgba(0,0,0,.06);
    }


    /* =========================
       BOTONES
    ========================= */

    .main-button {
      width: 100%;

      height: 48px;

      border: none;

      border-radius: 11px;

      background: #111;

      color: white;

      font-size: 14px;

      font-weight: 800;

      cursor: pointer;

      transition:
        .2s ease;

      margin-top: 11px;
    }


    .main-button:hover {
      background: #292929;

      transform:
        translateY(-1px);

      box-shadow:
        0 7px 15px
        rgba(0,0,0,.15);
    }


    .main-button:active {
      transform:
        scale(.98);
    }


    .main-button:disabled {
      opacity: .55;

      cursor: not-allowed;

      transform: none;

      box-shadow: none;
    }


    /* =========================
       RESUMEN
    ========================= */

    .selected-info {
      display: none;

      background: #f5f5f5;

      border-radius: 11px;

      padding: 12px;

      margin-top: 10px;

      font-size: 12px;

      line-height: 1.6;
    }


    /* =========================
       MENSAJE
    ========================= */

    .message {
      display: none;

      margin-top: 13px;

      border-radius: 15px;

      padding: 18px 13px;

      text-align: center;
    }


    /* =========================
       CONFIRMACIÓN
    ========================= */

    .success {
      display: block;

      background: #f2fff6;

      border:
        1px
        solid
        #55bd78;

      color: #111;

      animation:
        confirmationIn
        .3s
        ease;
    }


    @keyframes confirmationIn {

      from {
        opacity: 0;

        transform:
          translateY(10px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);
      }

    }


    .success-icon {
      width: 43px;
      height: 43px;

      margin:
        0
        auto
        9px;

      border-radius: 50%;

      background: #20a35a;

      color: white;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 23px;

      font-weight: 800;
    }


    .success-title {
      font-size: 20px;

      font-weight: 800;

      margin-bottom: 4px;
    }


    .success-subtitle {
      font-size: 12px;

      color: #555;

      margin-bottom: 15px;
    }


    .confirmation-grid {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 1px;

      background: #d9eee1;

      border-radius: 11px;

      overflow: hidden;
    }


    .confirmation-item {
      background: #f9fffb;

      padding:
        11px
        5px;
    }


    .confirmation-label {
      font-size: 9px;

      color: #777;

      margin-bottom: 3px;

      font-weight: 700;
    }


    .confirmation-value {
      font-size: 12px;

      font-weight: 800;

      word-break: break-word;
    }


    /* =========================
       ERROR
    ========================= */

    .error {
      display: block;

      background: #fff0f0;

      border:
        1px
        solid
        #e3a2a2;

      color: #9d0000;

      border-radius: 11px;

      padding: 12px;

      font-size: 12px;

      line-height: 1.5;
    }


    /* =========================
       LOADING
    ========================= */

    .loading {
      text-align: center;

      color: #777;

      padding: 14px;

      font-size: 13px;
    }


    /* =========================
       FOOTER
    ========================= */

    .footer {
      text-align: center;

      color: #777;

      font-size: 11px;

      padding:
        5px
        10px
        25px;
    }


    /* =========================
       CELULAR
    ========================= */

    @media (max-width: 600px) {

      .header {
        padding:
          18px
          12px;
      }


      .header h1 {
        font-size: 24px;
      }


      .container {
        width:
          calc(100% - 18px);

        margin-top: 11px;
      }


      .card {
        padding: 15px;

        border-radius: 15px;
      }


      .section-title h2 {
        font-size: 16px;
      }


      .description {
        margin-left: 39px;

        font-size: 11px;
      }


      .data-grid {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       HEADER
  ========================= -->

  <header class="header">

    <h1>
      Kenier Barber Studio
    </h1>

    <p>
      RESERVA TU CITA
    </p>

  </header>



  <main class="container">


    <!-- =========================
         1. SERVICIO
    ========================= -->

    <section class="card">

      <div class="section-title">

        <div class="number">
          1
        </div>

        <h2>
          Selecciona tu servicio
        </h2>

      </div>


      <div class="description">
        Todos los servicios incluyen arreglo de barba y cejas.
      </div>


      <div class="dropdown">

        <button
          type="button"
          class="dropdown-button"
          id="serviceButton"
        >

          <div class="dropdown-left">

            <span class="dropdown-icon">
              ✂️
            </span>

            <span id="serviceText">
              Selecciona un servicio
            </span>

          </div>

          <span class="dropdown-arrow">
            ⌄
          </span>

        </button>


        <div
          class="dropdown-menu"
          id="serviceMenu"
        >

          <button
            type="button"
            class="service-item"
            data-service="Pelado con estilo — $500 pesos"
          >

            <div class="service-main">

              <span class="service-name">
                Pelado con estilo
              </span>

              <span class="service-price">
                $500
              </span>

            </div>

            <div class="service-sub">
              Servicio completo
            </div>

          </button>


          <button
            type="button"
            class="service-item"
            data-service="Pelado clásico o al cero — $300 pesos"
          >

            <div class="service-main">

              <span class="service-name">
                Pelado clásico o al cero
              </span>

              <span class="service-price">
                $300
              </span>

            </div>

            <div class="service-sub">
              Personas mayores
            </div>

          </button>


          <button
            type="button"
            class="service-item"
            data-service="Pelado para niños — $300 pesos"
          >

            <div class="service-main">

              <span class="service-name">
                Pelado para niños
              </span>

              <span class="service-price">
                $300
              </span>

            </div>

            <div class="service-sub">
              Menores de 12 años
            </div>

          </button>

        </div>

      </div>

    </section>



    <!-- =========================
         2. FECHA
    ========================= -->

    <section class="card">

      <div class="section-title">

        <div class="number">
          2
        </div>

        <h2>
          Selecciona la fecha
        </h2>

      </div>


      <input
        type="date"
        id="date"
        class="date-input"
      >


      <button
        type="button"
        id="loadButton"
        class="main-button"
      >
        Ver horarios disponibles
      </button>

    </section>



    <!-- =========================
         3. HORARIO
    ========================= -->

    <section
      class="card"
      id="scheduleCard"
      style="display:none;"
    >

      <div class="section-title">

        <div class="number">
          3
        </div>

        <h2>
          Selecciona el horario
        </h2>

      </div>


      <div class="dropdown">

        <button
          type="button"
          class="dropdown-button"
          id="timeButton"
        >

          <div class="dropdown-left">

            <span class="dropdown-icon">
              🕐
            </span>

            <span id="timeText">
              Selecciona un horario disponible
            </span>

          </div>

          <span class="dropdown-arrow">
            ⌄
          </span>

        </button>


        <div
          class="dropdown-menu"
          id="timeMenu"
        ></div>

      </div>

    </section>



    <!-- =========================
         4. DATOS
    ========================= -->

    <section
      class="card"
      id="bookingCard"
      style="display:none;"
    >

      <div class="section-title">

        <div class="number">
          4
        </div>

        <h2>
          Tus datos
        </h2>

      </div>


      <div class="data-grid">

        <div>

          <label
            class="input-label"
            for="name"
          >
            Nombre
          </label>

          <input
            type="text"
            id="name"
            class="text-input"
            placeholder="Tu nombre"
            autocomplete="name"
          >

        </div>


        <div>

          <label
            class="input-label"
            for="phone"
          >
            Teléfono
          </label>

          <input
            type="tel"
            id="phone"
            class="text-input"
            placeholder="Tu teléfono"
            autocomplete="tel"
          >

        </div>

      </div>


      <div
        id="selectedInfo"
        class="selected-info"
      ></div>


      <button
        type="button"
        id="bookButton"
        class="main-button"
      >
        ✓ &nbsp; Confirmar cita
      </button>

    </section>



    <!-- =========================
         CONFIRMACIÓN
         
         ESTA TARJETA ESTÁ
         FUERA DE bookingCard
         PARA QUE NUNCA SE OCULTE
         AL ACTUALIZAR HORARIOS.
    ========================= -->

    <section
      id="confirmationCard"
      class="message"
    ></section>


  </main>


  <footer class="footer">

    Kenier Barber Studio
    ·
    Gracias por preferirnos

  </footer>



  <script>


    /* =========================
       API
    ========================= */

    const API_URL =
      "https://kenier-barber-studio.pages.dev/api/appointments";


    /* =========================
       HORARIOS
    ========================= */

    const times = [
      "08:00",
      "09:00",
      "10:00",
      "11:00",
      "12:00",
      "13:00",
      "14:00",
      "15:00",
      "16:00",
      "17:00",
      "18:00"
    ];


    /* =========================
       ELEMENTOS
    ========================= */

    const dateInput =
      document.getElementById("date");

    const loadButton =
      document.getElementById("loadButton");

    const scheduleCard =
      document.getElementById("scheduleCard");

    const bookingCard =
      document.getElementById("bookingCard");

    const bookButton =
      document.getElementById("bookButton");

    const nameInput =
      document.getElementById("name");

    const phoneInput =
      document.getElementById("phone");

    const selectedInfo =
      document.getElementById("selectedInfo");

    const confirmationCard =
      document.getElementById("confirmationCard");


    /* =========================
       SERVICIO
    ========================= */

    const serviceButton =
      document.getElementById("serviceButton");

    const serviceMenu =
      document.getElementById("serviceMenu");

    const serviceText =
      document.getElementById("serviceText");


    let selectedService = null;

    let selectedTime = null;


    /* =========================
       FECHA MÍNIMA
    ========================= */

    const today =
      new Date()
        .toISOString()
        .split("T")[0];

    dateInput.min =
      today;


    /* =========================
       SERVICIO DROPDOWN
    ========================= */

    serviceButton.addEventListener(
      "click",
      function(event) {

        event.stopPropagation();

        const isOpen =
          serviceMenu.classList.toggle(
            "open"
          );

        serviceButton.classList.toggle(
          "active",
          isOpen
        );

      }
    );


    document
      .querySelectorAll(".service-item")
      .forEach(item => {

        item.addEventListener(
          "click",
          function(event) {

            event.stopPropagation();


            selectedService =
              this.dataset.service;


            serviceText.textContent =
              getShortServiceName(
                selectedService
              );


            document
              .querySelectorAll(
                ".service-item"
              )
              .forEach(item => {

                item.classList.remove(
                  "selected"
                );

              });


            this.classList.add(
              "selected"
            );


            serviceMenu.classList.remove(
              "open"
            );

            serviceButton.classList.remove(
              "active"
            );


            updateSelectedInfo();

          }
        );

      });


    function getShortServiceName(
      service
    ) {

      if (
        service.includes(
          "Pelado con estilo"
        )
      ) {

        return "Pelado con estilo — $500";

      }


      if (
        service.includes(
          "Pelado clásico"
        )
      ) {

        return "Pelado clásico o al cero — $300";

      }


      if (
        service.includes(
          "Pelado para niños"
        )
      ) {

        return "Pelado para niños — $300";

      }


      return service;

    }



    /* =========================
       HORARIO DROPDOWN
    ========================= */

    const timeButton =
      document.getElementById("timeButton");

    const timeMenu =
      document.getElementById("timeMenu");

    const timeText =
      document.getElementById("timeText");


    timeButton.addEventListener(
      "click",
      function(event) {

        event.stopPropagation();


        if (
          timeMenu.children.length === 0
        ) {

          return;

        }


        const isOpen =
          timeMenu.classList.toggle(
            "open"
          );


        timeButton.classList.toggle(
          "active",
          isOpen
        );

      }
    );



    /* =========================
       CERRAR MENÚS
    ========================= */

    document.addEventListener(
      "click",
      function() {

        serviceMenu.classList.remove(
          "open"
        );

        serviceButton.classList.remove(
          "active"
        );


        timeMenu.classList.remove(
          "open"
        );

        timeButton.classList.remove(
          "active"
        );

      }
    );



    /* =========================
       FORMATO HORA
    ========================= */

    function formatTime(time) {

      const [hour, minute] =
        time.split(":");


      let h =
        parseInt(hour);


      const ampm =
        h >= 12
          ? "PM"
          : "AM";


      h =
        h % 12;


      if (h === 0) {
        h = 12;
      }


      return `${h}:${minute} ${ampm}`;

    }



    /* =========================
       FORMATO FECHA
    ========================= */

    function formatDate(date) {

      const parts =
        date.split("-");


      if (
        parts.length !== 3
      ) {

        return date;

      }


      const year =
        parts[0];

      const month =
        parseInt(
          parts[1],
          10
        );

      const day =
        parseInt(
          parts[2],
          10
        );


      const months = [

        "enero",
        "febrero",
        "marzo",
        "abril",
        "mayo",
        "junio",
        "julio",
        "agosto",
        "septiembre",
        "octubre",
        "noviembre",
        "diciembre"

      ];


      return `
        ${day}
        de
        ${months[month - 1]}
        de
        ${year}
      `;

    }



    /* =========================
       INFORMACIÓN SELECCIONADA
    ========================= */

    function updateSelectedInfo() {

      if (
        !selectedService ||
        !selectedTime
      ) {

        selectedInfo.style.display =
          "none";

        return;

      }


      selectedInfo.innerHTML = `

        <strong>Servicio:</strong>
        ${escapeHtml(
          getShortServiceName(
            selectedService
          )
        )}

        <br>

        <strong>Horario:</strong>
        ${formatTime(
          selectedTime
        )}

      `;


      selectedInfo.style.display =
        "block";

    }



    /* =========================
       OCULTAR CONFIRMACIÓN
       SOLO CUANDO EL CLIENTE
       CAMBIA DE FECHA
    ========================= */

    dateInput.addEventListener(
      "change",
      function() {

        confirmationCard.style.display =
          "none";

        confirmationCard.innerHTML =
          "";


        scheduleCard.style.display =
          "none";


        bookingCard.style.display =
          "none";


        selectedTime =
          null;


        timeText.textContent =
          "Selecciona un horario disponible";


        timeMenu.innerHTML =
          "";


        selectedInfo.style.display =
          "none";

      }
    );



    /* =========================
       CARGAR HORARIOS
       
       IMPORTANTE:
       Esta función NO OCULTA
       bookingCard.
       
       Así después de reservar
       podemos actualizar los
       horarios sin desaparecer
       la confirmación.
    ========================= */

    async function refreshTimes(
      date
    ) {

      timeMenu.innerHTML =
        `<div class="loading">
          Cargando horarios...
        </div>`;


      try {

        const response =
          await fetch(
            `${API_URL}?date=${encodeURIComponent(date)}`,
            {
              method: "GET",
              mode: "cors",
              cache: "no-store"
            }
          );


        const raw =
          await response.text();


        let data;


        try {

          data =
            JSON.parse(raw);

        } catch {

          throw new Error(
            "Respuesta inválida del servidor."
          );

        }


        if (!response.ok) {

          throw new Error(
            data.error ||
            "No se pudieron cargar las citas."
          );

        }


        const bookedTimes =
          new Set(
            data.map(
              appointment =>
                appointment.appointment_time
            )
          );


        const availableTimes =
          times.filter(
            time =>
              !bookedTimes.has(time)
          );


        timeMenu.innerHTML =
          "";


        if (
          availableTimes.length === 0
        ) {

          timeMenu.innerHTML = `
            <div class="loading">
              No quedan horarios disponibles
              para este día.
            </div>
          `;

          return;

        }


        availableTimes.forEach(
          time => {

            const item =
              document.createElement(
                "button"
              );


            item.type =
              "button";


            item.className =
              "time-item";


            item.textContent =
              formatTime(time);


            item.addEventListener(
              "click",
              function(event) {

                event.stopPropagation();


                document
                  .querySelectorAll(
                    ".time-item"
                  )
                  .forEach(
                    x =>
                      x.classList.remove(
                        "selected"
                      )
                  );


                this.classList.add(
                  "selected"
                );


                selectedTime =
                  time;


                timeText.textContent =
                  formatTime(time);


                timeMenu.classList.remove(
                  "open"
                );


                timeButton.classList.remove(
                  "active"
                );


                bookingCard.style.display =
                  "block";


                updateSelectedInfo();


                /*
                  Si el cliente vuelve a
                  seleccionar otro horario,
                  quitamos la confirmación
                  anterior para no confundir.
                */

                confirmationCard.style.display =
                  "none";


                confirmationCard.innerHTML =
                  "";


                setTimeout(
                  function() {

                    bookingCard.scrollIntoView({
                      behavior: "smooth",
                      block: "start"
                    });

                  },
                  80
                );

              }
            );


            timeMenu.appendChild(
              item
            );

          }
        );


      } catch(error) {

        timeMenu.innerHTML = `
          <div class="error">
            ❌ ${escapeHtml(
              error.message
            )}
          </div>
        `;

      }

    }



    /* =========================
       BOTÓN VER HORARIOS
    ========================= */

    loadButton.addEventListener(
      "click",
      async function() {

        const date =
          dateInput.value;


        if (!date) {

          alert(
            "Selecciona una fecha."
          );

          return;

        }


        loadButton.disabled =
          true;


        loadButton.textContent =
          "Cargando horarios...";


        scheduleCard.style.display =
          "block";


        bookingCard.style.display =
          "none";


        confirmationCard.style.display =
          "none";


        confirmationCard.innerHTML =
          "";


        selectedTime =
          null;


        timeText.textContent =
          "Selecciona un horario disponible";


        timeMenu.classList.remove(
          "open"
        );


        await refreshTimes(
          date
        );


        loadButton.disabled =
          false;


        loadButton.textContent =
          "Ver horarios disponibles";


        scheduleCard.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });

      }
    );



    /* =========================
       CONFIRMAR CITA
    ========================= */

    bookButton.addEventListener(
      "click",
      async function() {


        const date =
          dateInput.value;


        const name =
          nameInput.value.trim();


        const phone =
          phoneInput.value.trim();



        /* VALIDAR SERVICIO */

        if (!selectedService) {

          showError(
            "❌ Selecciona el servicio que deseas."
          );

          return;

        }



        /* VALIDAR FECHA */

        if (!date) {

          showError(
            "❌ Selecciona una fecha."
          );

          return;

        }



        /* VALIDAR HORA */

        if (!selectedTime) {

          showError(
            "❌ Selecciona un horario."
          );

          return;

        }



        /* VALIDAR NOMBRE */

        if (!name) {

          showError(
            "❌ Escribe tu nombre."
          );

          nameInput.focus();

          return;

        }



        /* VALIDAR TELÉFONO */

        if (!phone) {

          showError(
            "❌ Escribe tu teléfono."
          );

          phoneInput.focus();

          return;

        }



        /* RESERVANDO */

        bookButton.disabled =
          true;


        bookButton.textContent =
          "Reservando...";



        try {


          const reservedService =
            selectedService;


          const reservedTime =
            selectedTime;


          const reservedDate =
            date;


          const reservedName =
            name;


          const reservedPhone =
            phone;



          const response =
            await fetch(
              API_URL,
              {

                method: "POST",

                mode: "cors",

                headers: {

                  "Content-Type":
                    "text/plain;charset=UTF-8"

                },

                body:
                  JSON.stringify({

                    date:
                      reservedDate,

                    time:
                      reservedTime,

                    name:
                      reservedName,

                    phone:
                      reservedPhone,

                    service:
                      reservedService

                  })

              }
            );



          const raw =
            await response.text();


          let data;


          try {

            data =
              JSON.parse(raw);

          } catch {

            throw new Error(
              "Respuesta inválida del servidor."
            );

          }



          if (!response.ok) {

            throw new Error(
              data.error ||
              "No se pudo reservar la cita."
            );

          }



          /* =========================
             MOSTRAR CONFIRMACIÓN
          ========================= */

          confirmationCard.className =
            "message success";


          confirmationCard.innerHTML = `

            <div class="success-icon">
              ✓
            </div>


            <div class="success-title">
              ¡Cita confirmada!
            </div>


            <div class="success-subtitle">
              Tu cita ha sido reservada correctamente.
            </div>


            <div class="confirmation-grid">


              <div class="confirmation-item">

                <div class="confirmation-label">
                  SERVICIO
                </div>

                <div class="confirmation-value">
                  ${escapeHtml(
                    getShortServiceName(
                      reservedService
                    )
                  )}
                </div>

              </div>



              <div class="confirmation-item">

                <div class="confirmation-label">
                  FECHA
                </div>

                <div class="confirmation-value">
                  ${escapeHtml(
                    formatDate(
                      reservedDate
                    )
                  )}
                </div>

              </div>



              <div class="confirmation-item">

                <div class="confirmation-label">
                  HORARIO
                </div>

                <div class="confirmation-value">
                  ${formatTime(
                    reservedTime
                  )}
                </div>

              </div>



              <div class="confirmation-item">

                <div class="confirmation-label">
                  CLIENTE
                </div>

                <div class="confirmation-value">
                  ${escapeHtml(
                    reservedName
                  )}
                </div>

              </div>



              <div class="confirmation-item">

                <div class="confirmation-label">
                  TELÉFONO
                </div>

                <div class="confirmation-value">
                  ${escapeHtml(
                    reservedPhone
                  )}
                </div>

              </div>


            </div>


            <div
              style="
                margin-top:14px;
                font-size:11px;
                color:#666;
              "
            >
              Gracias por preferir
              <strong>
                Kenier Barber Studio
              </strong>.
            </div>

          `;


          confirmationCard.style.display =
            "block";



          /* =========================
             LIMPIAR DATOS
          ========================= */

          selectedTime =
            null;


          timeText.textContent =
            "Selecciona un horario disponible";


          selectedInfo.style.display =
            "none";


          nameInput.value =
            "";


          phoneInput.value =
            "";



          /*
            AQUÍ ESTÁ LA DIFERENCIA:

            Actualizamos solamente
            los horarios.

            NO escondemos bookingCard.

            NO escondemos confirmationCard.
          */

          await refreshTimes(
            reservedDate
          );



          /*
            Volvemos a mostrar
            la confirmación por si
            el navegador actualizó
            algún elemento visual.
          */

          confirmationCard.style.display =
            "block";



          confirmationCard.scrollIntoView({
            behavior: "smooth",
            block: "center"
          });



        } catch(error) {


          showError(
            `❌ ${error.message}`
          );


        } finally {

          bookButton.disabled =
            false;


          bookButton.textContent =
            "✓   Confirmar cita";

        }

      }
    );



    /* =========================
       ERROR
    ========================= */

    function showError(
      text
    ) {

      confirmationCard.className =
        "message error";


      confirmationCard.innerHTML =
        text;


      confirmationCard.style.display =
        "block";


      confirmationCard.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });

    }



    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHtml(
      text
    ) {

      const div =
        document.createElement(
          "div"
        );


      div.textContent =
        text ?? "";


      return div.innerHTML;

    }

  </script>

</body>

</html>
