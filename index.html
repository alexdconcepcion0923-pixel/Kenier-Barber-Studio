<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kenier Barber Studio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 25px 18px 40px;
    }

    .logo {
      text-align: center;
      margin-bottom: 10px;
    }

    .logo h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: 1px;
    }

    .logo p {
      margin: 6px 0 25px;
      color: #aaa;
      font-size: 14px;
    }

    .card {
      background: #1c1c1c;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #ddd;
    }

    input {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #292929;
      color: white;
      font-size: 16px;
      margin-bottom: 18px;
      outline: none;
    }

    input:focus {
      background: #333;
    }

    .times {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .time-btn {
      padding: 13px 5px;
      border: none;
      border-radius: 10px;
      background: #333;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .time-btn:hover {
      background: #444;
    }

    .time-btn.selected {
      background: white;
      color: black;
      font-weight: bold;
    }

    .time-btn.booked {
      background: #555;
      color: #999;
      cursor: not-allowed;
      text-decoration: line-through;
    }

    .reserve-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: white;
      color: black;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .reserve-btn:hover {
      background: #ddd;
    }

    .reserve-btn:disabled {
      background: #555;
      color: #999;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 14px;
      border-radius: 10px;
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .success {
      background: #173b24;
      color: #8ff0a4;
    }

    .error {
      background: #3b1717;
      color: #ff9b9b;
    }

    .loading {
      text-align: center;
      color: #aaa;
      font-size: 14px;
      margin-top: 10px;
    }

    .footer {
      text-align: center;
      color: #777;
      font-size: 12px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      <h1>KENIER BARBER STUDIO</h1>
      <p>Reserva tu cita</p>
    </div>

    <div class="card">

      <label for="date">Selecciona la fecha</label>

      <input type="date" id="date">

      <label>Selecciona el horario</label>

      <div id="loading" class="loading">
        Cargando horarios disponibles...
      </div>

      <div id="times" class="times"></div>

    </div>

    <div class="card">

      <label for="name">Tu nombre</label>

      <input
        type="text"
        id="name"
        placeholder="Escribe tu nombre"
        autocomplete="name"
      >

      <label for="phone">Número de teléfono</label>

      <input
        type="tel"
        id="phone"
        placeholder="Escribe tu número"
        autocomplete="tel"
      >

      <button
        id="reserveBtn"
        class="reserve-btn"
        onclick="reserveAppointment()"
      >
        Reservar cita
      </button>

      <div id="message" class="message"></div>

    </div>

    <div class="footer">
      Kenier Barber Studio · 8:00 AM – 7:00 PM
    </div>

  </div>


<script>

  /*
    BACKEND DE CLOUDFLARE
  */
  const API_URL =
    "https://kenier-barber-studio.pages.dev/api/appointments";


  /*
    HORARIOS DISPONIBLES

    8:00 AM hasta 6:00 PM
    Cada cita dura 1 hora
  */
  const times = [
    "08:00",
    "09:00",
    "10:00",
    "11:00",
    "12:00",
    "13:00",
    "14:00",
    "15:00",
    "16:00",
    "17:00",
    "18:00"
  ];


  let selectedTime = null;


  const dateInput =
    document.getElementById("date");

  const timesContainer =
    document.getElementById("times");

  const loading =
    document.getElementById("loading");

  const reserveBtn =
    document.getElementById("reserveBtn");

  const message =
    document.getElementById("message");


  /*
    OBTENER LA FECHA DE HOY
  */
  function getToday() {

    const today = new Date();

    const year =
      today.getFullYear();

    const month =
      String(today.getMonth() + 1)
        .padStart(2, "0");

    const day =
      String(today.getDate())
        .padStart(2, "0");

    return `${year}-${month}-${day}`;

  }


  /*
    MOSTRAR MENSAJE
  */
  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      "message " + type;

    message.style.display = "block";

  }


  /*
    OCULTAR MENSAJE
  */
  function hideMessage() {

    message.style.display = "none";

  }


  /*
    CARGAR LAS CITAS DESDE CLOUDFLARE
  */
  async function loadAppointments() {

    const date =
      dateInput.value;

    if (!date) {
      return;
    }

    selectedTime = null;

    reserveBtn.disabled = false;

    hideMessage();

    loading.style.display = "block";

    timesContainer.innerHTML = "";


    try {

      const response = await fetch(
        `${API_URL}?date=${encodeURIComponent(date)}`
      );


      /*
        LEEMOS LA RESPUESTA COMO TEXTO
        ANTES DE CONVERTIRLA A JSON.

        Esto evita el problema de Safari:
        "The string did not match the expected pattern"
      */

      const raw =
        await response.text();

      let data = {};

      try {

        data =
          raw
            ? JSON.parse(raw)
            : {};

      } catch (parseError) {

        throw new Error(
          `Respuesta del servidor (${response.status}): ${raw.slice(0, 200)}`
        );

      }


      if (!response.ok) {

        throw new Error(
          data.error ||
          `Error del servidor (${response.status})`
        );

      }


      const appointments =
        data.appointments || [];


      /*
        OBTENER LOS HORARIOS OCUPADOS
      */
      const bookedTimes =
        appointments.map(
          appointment =>
            appointment.appointment_time
        );


      /*
        CREAR LOS BOTONES DE HORARIOS
      */
      times.forEach(time => {

        const button =
          document.createElement("button");

        button.type = "button";

        button.className =
          "time-btn";

        button.textContent =
          formatTime(time);


        /*
          COMPROBAR SI EL HORARIO ESTÁ OCUPADO
        */
        if (bookedTimes.includes(time)) {

          button.classList.add("booked");

          button.disabled = true;

          button.textContent =
            formatTime(time) +
            " · Ocupado";

        } else {

          button.addEventListener(
            "click",
            () => selectTime(time, button)
          );

        }


        timesContainer.appendChild(button);

      });


    } catch (error) {

      console.error(
        "Error cargando citas:",
        error
      );

      showMessage(
        "❌ No se pudieron cargar los horarios. " +
        error.message,
        "error"
      );

    } finally {

      loading.style.display = "none";

    }

  }


  /*
    SELECCIONAR HORARIO
  */
  function selectTime(time, button) {

    selectedTime = time;


    /*
      QUITAR SELECCIÓN ANTERIOR
    */
    document
      .querySelectorAll(".time-btn")
      .forEach(btn => {

        btn.classList.remove("selected");

      });


    /*
      MARCAR EL HORARIO SELECCIONADO
    */
    button.classList.add("selected");


    hideMessage();

  }


  /*
    CONVERTIR 24 HORAS A 12 HORAS
  */
  function formatTime(time) {

    const parts =
      time.split(":");

    let hour =
      parseInt(parts[0], 10);

    const minute =
      parts[1];

    const ampm =
      hour >= 12 ? "PM" : "AM";


    hour =
      hour % 12 || 12;


    return `${hour}:${minute} ${ampm}`;

  }


  /*
    RESERVAR CITA
  */
  async function reserveAppointment() {

    hideMessage();


    const date =
      dateInput.value;

    const name =
      document
        .getElementById("name")
        .value
        .trim();

    const phone =
      document
        .getElementById("phone")
        .value
        .trim();


    /*
      VALIDACIONES
    */

    if (!date) {

      showMessage(
        "❌ Selecciona una fecha.",
        "error"
      );

      return;

    }


    if (!selectedTime) {

      showMessage(
        "❌ Selecciona un horario.",
        "error"
      );

      return;

    }


    if (!name) {

      showMessage(
        "❌ Escribe tu nombre.",
        "error"
      );

      return;

    }


    if (!phone) {

      showMessage(
        "❌ Escribe tu número de teléfono.",
        "error"
      );

      return;

    }


    /*
      EVITAR DOBLE CLIC
    */
    reserveBtn.disabled = true;

    reserveBtn.textContent =
      "Reservando...";


    try {


      /*
        USAMOS text/plain PARA EVITAR
        EL PREFLIGHT DE CORS EN SAFARI.

        CLOUDFLARE SIGUE RECIBIENDO
        EL BODY COMO JSON.
      */

      const response =
        await fetch(API_URL, {

          method: "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=UTF-8"

          },

          body: JSON.stringify({

            date: date,

            time: selectedTime,

            name: name,

            phone: phone

          })

        });


      /*
        LEER RESPUESTA COMO TEXTO
      */
      const raw =
        await response.text();


      /*
        CONVERTIR RESPUESTA A JSON
      */
      let data = {};

      try {

        data =
          raw
            ? JSON.parse(raw)
            : {};

      } catch (parseError) {

        throw new Error(
          `Respuesta del servidor (${response.status}): ${raw.slice(0, 300)}`
        );

      }


      /*
        ERROR DEL SERVIDOR
      */
      if (!response.ok) {

        if (response.status === 409) {

          throw new Error(
            "Ese horario acaba de ser reservado por otra persona. Selecciona otro horario."
          );

        }


        throw new Error(
          data.error ||
          `Error del servidor (${response.status})`
        );

      }


      /*
        RESERVA EXITOSA
      */
      showMessage(
        "✅ ¡Cita reservada correctamente!",
        "success"
      );


      /*
        LIMPIAR FORMULARIO
      */
      document.getElementById("name").value = "";

      document.getElementById("phone").value = "";


      /*
        QUITAR HORARIO SELECCIONADO
      */
      selectedTime = null;


      /*
        RECARGAR HORARIOS

        La hora recién reservada aparecerá
        inmediatamente como ocupada.
      */
      await loadAppointments();


    } catch (error) {

      console.error(
        "Error reservando cita:",
        error
      );


      showMessage(
        "❌ " + error.message,
        "error"
      );


    } finally {

      reserveBtn.disabled = false;

      reserveBtn.textContent =
        "Reservar cita";

    }

  }


  /*
    CUANDO CAMBIA LA FECHA
  */
  dateInput.addEventListener(
    "change",
    loadAppointments
  );


  /*
    PONER HOY COMO FECHA INICIAL
  */
  dateInput.value =
    getToday();


  /*
    NO PERMITIR FECHAS PASADAS
  */
  dateInput.min =
    getToday();


  /*
    CARGAR LOS HORARIOS DE HOY
  */
  loadAppointments();

</script>

</body>
</html>
