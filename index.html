<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">

  <title>Kenier Barber Studio</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #111;
      min-height: 100vh;
    }

    .header {
      background: #111;
      color: white;
      padding: 32px 20px 28px;
      text-align: center;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .header p {
      margin-top: 7px;
      color: #bdbdbd;
      font-size: 14px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 22px 16px 40px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,.06);
      margin-bottom: 18px;
    }

    .card h2 {
      font-size: 19px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 11px;
      font-size: 16px;
      background: #fafafa;
      margin-bottom: 18px;
    }

    .times {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .time {
      border: 1px solid #ddd;
      background: white;
      padding: 14px 8px;
      border-radius: 11px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .time:hover {
      background: #f0f0f0;
    }

    .time.selected {
      background: #111;
      color: white;
      border-color: #111;
    }

    .button {
      width: 100%;
      border: none;
      background: #111;
      color: white;
      padding: 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 5px;
    }

    .button:active {
      transform: scale(.98);
    }

    .message {
      display: none;
      background: #e9f8ed;
      color: #176b2c;
      padding: 15px;
      border-radius: 12px;
      margin-top: 15px;
      line-height: 1.5;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      color: #888;
      font-size: 12px;
      padding: 10px;
    }

    .selected-info {
      background: #f4f4f4;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 14px;
      display: none;
    }
  </style>
</head>

<body>

  <header class="header">
    <h1>Kenier Barber Studio</h1>
    <p>Reserva tu cita</p>
  </header>

  <main class="container">

    <div class="card">

      <h2>📅 Selecciona el día</h2>

      <label for="date">Fecha</label>

      <input
        type="date"
        id="date"
      >

    </div>


    <div class="card">

      <h2>⏰ Selecciona tu horario</h2>

      <div id="selectedInfo" class="selected-info"></div>

      <div class="times" id="times">

        <button class="time" data-time="08:00">8:00 AM</button>
        <button class="time" data-time="09:00">9:00 AM</button>
        <button class="time" data-time="10:00">10:00 AM</button>
        <button class="time" data-time="11:00">11:00 AM</button>
        <button class="time" data-time="12:00">12:00 PM</button>
        <button class="time" data-time="13:00">1:00 PM</button>
        <button class="time" data-time="14:00">2:00 PM</button>
        <button class="time" data-time="15:00">3:00 PM</button>
        <button class="time" data-time="16:00">4:00 PM</button>
        <button class="time" data-time="17:00">5:00 PM</button>
        <button class="time" data-time="18:00">6:00 PM</button>

      </div>

    </div>


    <div class="card">

      <h2>👤 Tus datos</h2>

      <label for="name">Nombre</label>

      <input
        type="text"
        id="name"
        placeholder="Escribe tu nombre"
      >

      <label for="phone">Teléfono</label>

      <input
        type="tel"
        id="phone"
        placeholder="Tu número de teléfono"
      >

      <button class="button" onclick="reserve()">
        Confirmar cita
      </button>

      <div id="message" class="message"></div>

    </div>

    <div class="footer">
      Kenier Barber Studio
    </div>

  </main>


  <script>

    let selectedTime = null;

    const dateInput = document.getElementById("date");

    const today = new Date();

    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, "0");
    const day = String(today.getDate()).padStart(2, "0");

    dateInput.min = `${year}-${month}-${day}`;
    dateInput.value = `${year}-${month}-${day}`;


    document.querySelectorAll(".time").forEach(button => {

      button.addEventListener("click", () => {

        document.querySelectorAll(".time").forEach(btn => {
          btn.classList.remove("selected");
        });

        button.classList.add("selected");

        selectedTime = button.dataset.time;

        const info = document.getElementById("selectedInfo");

        info.style.display = "block";

        info.innerHTML =
          "Horario seleccionado: <strong>" +
          formatTime(selectedTime) +
          "</strong>";

      });

    });


    function formatTime(time) {

      const [hour, minute] = time.split(":");

      let h = parseInt(hour);

      const suffix = h >= 12 ? "PM" : "AM";

      if (h > 12) h -= 12;

      if (h === 0) h = 12;

      return `${h}:${minute} ${suffix}`;

    }


    function reserve() {

      const name = document.getElementById("name").value.trim();

      const phone = document.getElementById("phone").value.trim();

      const date = dateInput.value;

      const message = document.getElementById("message");


      if (!date) {

        alert("Selecciona una fecha.");

        return;

      }


      if (!selectedTime) {

        alert("Selecciona un horario.");

        return;

      }


      if (!name) {

        alert("Escribe tu nombre.");

        return;

      }


      if (!phone) {

        alert("Escribe tu número de teléfono.");

        return;

      }


      const readableDate =
        new Date(date + "T12:00:00").toLocaleDateString(
          "es-ES",
          {
            weekday: "long",
            day: "numeric",
            month: "long"
          }
        );


      message.style.display = "block";

      message.innerHTML =
        "✅ <strong>Solicitud preparada</strong><br><br>" +
        "Cliente: " + name + "<br>" +
        "Fecha: " + readableDate + "<br>" +
        "Hora: " + formatTime(selectedTime) + "<br><br>" +
        "En la siguiente versión conectaremos esta reserva " +
        "con la agenda de Kenier.";

    }

  </script>

</body>
</html>
