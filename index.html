<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kenier Barber Studio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 25px 18px 40px;
    }

    .logo {
      text-align: center;
      margin-bottom: 10px;
    }

    .logo h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: 1px;
    }

    .logo p {
      margin: 6px 0 25px;
      color: #aaa;
      font-size: 14px;
    }

    .card {
      background: #1c1c1c;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #ddd;
    }

    input {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #292929;
      color: white;
      font-size: 16px;
      margin-bottom: 18px;
      outline: none;
    }

    input:focus {
      background: #333;
    }

    .times {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .time-btn {
      padding: 13px 5px;
      border: none;
      border-radius: 10px;
      background: #333;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .time-btn:hover {
      background: #444;
    }

    .time-btn.selected {
      background: white;
      color: black;
      font-weight: bold;
    }

    .time-btn.booked {
      background: #555;
      color: #999;
      cursor: not-allowed;
      text-decoration: line-through;
    }

    .reserve-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: white;
      color: black;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .reserve-btn:hover {
      background: #ddd;
    }

    .reserve-btn:disabled {
      background: #555;
      color: #999;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 14px;
      border-radius: 10px;
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .success {
      background: #173b24;
      color: #8ff0a4;
    }

    .error {
      background: #3b1717;
      color: #ff9b9b;
    }

    .loading {
      text-align: center;
      color: #aaa;
      font-size: 14px;
      margin-top: 10px;
    }

    .footer {
      text-align: center;
      color: #777;
      font-size: 12px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      <h1>KENIER BARBER STUDIO</h1>
      <p>Book your appointment</p>
    </div>

    <div class="card">

      <label for="date">Select date</label>
      <input type="date" id="date">

      <label>Select time</label>

      <div id="loading" class="loading">
        Loading available times...
      </div>

      <div id="times" class="times"></div>

    </div>

    <div class="card">

      <label for="name">Your name</label>
      <input
        type="text"
        id="name"
        placeholder="Enter your name"
        autocomplete="name"
      >

      <label for="phone">Phone number</label>
      <input
        type="tel"
        id="phone"
        placeholder="Enter your phone number"
        autocomplete="tel"
      >

      <button
        id="reserveBtn"
        class="reserve-btn"
        onclick="reserveAppointment()"
      >
        Reserve Appointment
      </button>

      <div id="message" class="message"></div>

    </div>

    <div class="footer">
      Kenier Barber Studio · 8:00 AM – 7:00 PM
    </div>

  </div>


<script>

  /*
    CLOUDFlARE BACKEND
  */
  const API_URL =
    "https://kenier-barber-studio.pages.dev/api/appointments";


  /*
    AVAILABLE TIMES

    8:00 AM through 6:00 PM
    Each appointment = 1 hour
  */
  const times = [
    "08:00",
    "09:00",
    "10:00",
    "11:00",
    "12:00",
    "13:00",
    "14:00",
    "15:00",
    "16:00",
    "17:00",
    "18:00"
  ];


  let selectedTime = null;


  const dateInput = document.getElementById("date");
  const timesContainer = document.getElementById("times");
  const loading = document.getElementById("loading");
  const reserveBtn = document.getElementById("reserveBtn");
  const message = document.getElementById("message");


  /*
    GET TODAY'S DATE
  */
  function getToday() {

    const today = new Date();

    const year = today.getFullYear();

    const month = String(
      today.getMonth() + 1
    ).padStart(2, "0");

    const day = String(
      today.getDate()
    ).padStart(2, "0");

    return `${year}-${month}-${day}`;
  }


  /*
    SHOW MESSAGE
  */
  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      "message " + type;

    message.style.display = "block";
  }


  /*
    HIDE MESSAGE
  */
  function hideMessage() {

    message.style.display = "none";

  }


  /*
    LOAD APPOINTMENTS FROM CLOUDFLARE
  */
  async function loadAppointments() {

    const date = dateInput.value;

    if (!date) {
      return;
    }

    selectedTime = null;

    reserveBtn.disabled = false;

    hideMessage();

    loading.style.display = "block";

    timesContainer.innerHTML = "";


    try {

      const response = await fetch(
        `${API_URL}?date=${encodeURIComponent(date)}`
      );


      /*
        IMPORTANT:
        We read the response as TEXT first.

        This prevents Safari from throwing:
        "The string did not match the expected pattern"
        when the server doesn't return valid JSON.
      */

      const raw = await response.text();

      let data = {};

      try {

        data = raw ? JSON.parse(raw) : {};

      } catch (parseError) {

        throw new Error(
          `Server response (${response.status}): ${raw.slice(0, 200)}`
        );

      }


      if (!response.ok) {

        throw new Error(
          data.error ||
          `Server error (${response.status})`
        );

      }


      const appointments =
        data.appointments || [];


      /*
        GET BOOKED TIMES
      */
      const bookedTimes =
        appointments.map(
          appointment =>
            appointment.appointment_time
        );


      /*
        CREATE TIME BUTTONS
      */
      times.forEach(time => {

        const button =
          document.createElement("button");

        button.type = "button";

        button.className = "time-btn";

        button.textContent =
          formatTime(time);


        /*
          CHECK IF TIME IS BOOKED
        */
        if (bookedTimes.includes(time)) {

          button.classList.add("booked");

          button.disabled = true;

          button.textContent =
            formatTime(time) + " · Booked";

        } else {

          button.addEventListener(
            "click",
            () => selectTime(time, button)
          );

        }


        timesContainer.appendChild(button);

      });


    } catch (error) {

      console.error(
        "Error loading appointments:",
        error
      );

      showMessage(
        "❌ Could not load available times. " +
        error.message,
        "error"
      );

    } finally {

      loading.style.display = "none";

    }

  }


  /*
    SELECT TIME
  */
  function selectTime(time, button) {

    selectedTime = time;


    /*
      Remove previous selection
    */
    document
      .querySelectorAll(".time-btn")
      .forEach(btn => {

        btn.classList.remove("selected");

      });


    /*
      Select clicked button
    */
    button.classList.add("selected");


    hideMessage();

  }


  /*
    FORMAT 24-HOUR TIME
    INTO 12-HOUR FORMAT
  */
  function formatTime(time) {

    const parts =
      time.split(":");

    let hour =
      parseInt(parts[0], 10);

    const minute =
      parts[1];

    const ampm =
      hour >= 12 ? "PM" : "AM";


    hour =
      hour % 12 || 12;


    return `${hour}:${minute} ${ampm}`;

  }


  /*
    RESERVE APPOINTMENT
  */
  async function reserveAppointment() {

    hideMessage();


    const date =
      dateInput.value;

    const name =
      document.getElementById("name").value.trim();

    const phone =
      document.getElementById("phone").value.trim();


    /*
      VALIDATION
    */

    if (!date) {

      showMessage(
        "❌ Please select a date.",
        "error"
      );

      return;

    }


    if (!selectedTime) {

      showMessage(
        "❌ Please select a time.",
        "error"
      );

      return;

    }


    if (!name) {

      showMessage(
        "❌ Please enter your name.",
        "error"
      );

      return;

    }


    if (!phone) {

      showMessage(
        "❌ Please enter your phone number.",
        "error"
      );

      return;

    }


    /*
      PREVENT DOUBLE CLICK
    */
    reserveBtn.disabled = true;

    reserveBtn.textContent =
      "Reserving...";


    try {


      /*
        IMPORTANT:

        We intentionally use text/plain instead
        of application/json.

        This avoids the CORS preflight request
        that can cause problems on Safari/iPhone.

        Cloudflare still reads the body using
        request.json().
      */

      const response =
        await fetch(API_URL, {

          method: "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=UTF-8"

          },

          body: JSON.stringify({

            date: date,

            time: selectedTime,

            name: name,

            phone: phone

          })

        });


      /*
        READ RESPONSE AS TEXT FIRST
      */
      const raw =
        await response.text();


      /*
        TRY TO CONVERT RESPONSE TO JSON
      */
      let data = {};

      try {

        data =
          raw
            ? JSON.parse(raw)
            : {};

      } catch (parseError) {

        throw new Error(
          `Server response (${response.status}): ${raw.slice(0, 300)}`
        );

      }


      /*
        SERVER ERROR
      */
      if (!response.ok) {

        if (response.status === 409) {

          throw new Error(
            "That time was just booked by someone else. Please choose another time."
          );

        }


        throw new Error(
          data.error ||
          `Server error (${response.status})`
        );

      }


      /*
        SUCCESS
      */
      showMessage(
        "✅ Appointment reserved successfully!",
        "success"
      );


      /*
        CLEAR FORM
      */
      document.getElementById("name").value = "";

      document.getElementById("phone").value = "";


      /*
        RESET SELECTED TIME
      */
      selectedTime = null;


      /*
        RELOAD TIMES

        This makes the newly booked
        appointment immediately appear
        as unavailable.
      */
      await loadAppointments();


    } catch (error) {

      console.error(
        "Reservation error:",
        error
      );


      showMessage(
        "❌ " + error.message,
        "error"
      );


    } finally {

      reserveBtn.disabled = false;

      reserveBtn.textContent =
        "Reserve Appointment";

    }

  }


  /*
    WHEN DATE CHANGES
  */
  dateInput.addEventListener(
    "change",
    loadAppointments
  );


  /*
    SET TODAY AS DEFAULT DATE
  */
  dateInput.value =
    getToday();


  /*
    PREVENT SELECTING PAST DATES
  */
  dateInput.min =
    getToday();


  /*
    LOAD TODAY'S APPOINTMENTS
  */
  loadAppointments();

</script>

</body>
</html>
