<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Kenier Barber Studio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 15px 40px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .container {
      max-width: 760px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 42px;
      margin: 15px 0 40px;
      font-weight: 800;
    }

    .card {
      background: white;
      border-radius: 25px;
      padding: 30px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h2 {
      font-size: 25px;
      margin-top: 0;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      padding: 18px;
      border: 2px solid #ddd;
      border-radius: 15px;
      font-size: 18px;
      margin-bottom: 25px;
      background: white;
    }

    .services {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 30px;
    }

    .service-option {
      position: relative;
    }

    .service-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .service-label {
      display: block;
      border: 2px solid #ddd;
      border-radius: 18px;
      padding: 18px;
      cursor: pointer;
      transition: 0.15s;
      background: white;
    }

    .service-label strong {
      display: block;
      font-size: 20px;
      margin-bottom: 5px;
    }

    .service-label span {
      display: block;
      font-size: 16px;
      color: #555;
    }

    .service-option input:checked + .service-label {
      border-color: #111;
      background: #111;
      color: white;
    }

    .service-option input:checked + .service-label span {
      color: #ddd;
    }

    .service-note {
      font-size: 15px;
      color: #555;
      margin-top: -15px;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .button {
      width: 100%;
      border: none;
      background: #111;
      color: white;
      padding: 20px;
      border-radius: 15px;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
    }

    .button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .times {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .time-button {
      padding: 18px 10px;
      border: 2px solid #ddd;
      background: white;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    .time-button:hover {
      border-color: #111;
    }

    .time-button.selected {
      background: #111;
      color: white;
      border-color: #111;
    }

    .time-button.booked {
      background: #e5e5e5;
      color: #999;
      border-color: #ddd;
      text-decoration: line-through;
      cursor: not-allowed;
    }

    .form-row {
      margin-bottom: 20px;
    }

    .message {
      display: none;
      padding: 20px;
      border-radius: 15px;
      margin-top: 20px;
      font-size: 18px;
      line-height: 1.5;
    }

    .success {
      display: block;
      background: #e8f7e8;
      color: #176b17;
      border: 1px solid #9ad39a;
    }

    .error {
      display: block;
      background: #ffe8e8;
      color: #a40000;
      border: 1px solid #e0a0a0;
    }

    .selected-info {
      display: none;
      background: #f1f1f1;
      border-radius: 15px;
      padding: 18px;
      margin-top: 20px;
      font-size: 17px;
      line-height: 1.6;
    }

    .loading {
      text-align: center;
      font-size: 18px;
      color: #666;
      padding: 20px;
    }

    @media (max-width: 600px) {
      body {
        padding: 15px 10px 30px;
      }

      h1 {
        font-size: 32px;
        margin-bottom: 30px;
      }

      .card {
        padding: 22px;
        border-radius: 22px;
      }

      .times {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Kenier Barber Studio</h1>

  <!-- SERVICIOS -->
  <div class="card">

    <h2>Selecciona tu servicio</h2>

    <div class="services">

      <div class="service-option">
        <input
          type="radio"
          name="service"
          id="style"
          value="Pelado con estilo — $500 pesos"
        >

        <label
          for="style"
          class="service-label"
        >
          <strong>💈 Pelado con estilo — $500</strong>
          <span>Servicio completo</span>
        </label>
      </div>

      <div class="service-option">
        <input
          type="radio"
          name="service"
          id="classic"
          value="Pelado clásico o al cero — $300 pesos"
        >

        <label
          for="classic"
          class="service-label"
        >
          <strong>✂️ Pelado clásico o al cero — $300</strong>
          <span>Personas mayores</span>
        </label>
      </div>

      <div class="service-option">
        <input
          type="radio"
          name="service"
          id="kids"
          value="Pelado para niños — $300 pesos"
        >

        <label
          for="kids"
          class="service-label"
        >
          <strong>👦 Pelado para niños — $300</strong>
          <span>Menores de 12 años</span>
        </label>
      </div>

    </div>

    <div class="service-note">
      Todos los servicios incluyen arreglo de barba y cejas.
    </div>

  </div>


  <!-- FECHA -->
  <div class="card">

    <h2>Seleccionar fecha</h2>

    <input
      type="date"
      id="date"
    >

    <button
      class="button"
      id="loadButton"
      type="button"
    >
      Ver horarios disponibles
    </button>

  </div>


  <!-- HORARIOS -->
  <div
    class="card"
    id="scheduleCard"
    style="display:none;"
  >

    <h2>Seleccionar horario</h2>

    <div
      id="times"
      class="times"
    ></div>

  </div>


  <!-- DATOS -->
  <div
    class="card"
    id="bookingCard"
    style="display:none;"
  >

    <h2>Datos de la cita</h2>

    <div class="form-row">
      <label for="name">
        Nombre
      </label>

      <input
        type="text"
        id="name"
        placeholder="Tu nombre"
        autocomplete="name"
      >
    </div>

    <div class="form-row">
      <label for="phone">
        Teléfono
      </label>

      <input
        type="tel"
        id="phone"
        placeholder="Tu teléfono"
        autocomplete="tel"
      >
    </div>

    <div
      id="selectedInfo"
      class="selected-info"
    ></div>

    <button
      class="button"
      id="bookButton"
      type="button"
    >
      Confirmar cita
    </button>

    <div
      id="message"
      class="message"
    ></div>

  </div>

</div>


<script>

  const API_URL =
    "https://kenier-barber-studio.pages.dev/api/appointments";

  const times = [
    "08:00",
    "09:00",
    "10:00",
    "11:00",
    "12:00",
    "13:00",
    "14:00",
    "15:00",
    "16:00",
    "17:00",
    "18:00"
  ];

  const dateInput =
    document.getElementById("date");

  const loadButton =
    document.getElementById("loadButton");

  const scheduleCard =
    document.getElementById("scheduleCard");

  const timesContainer =
    document.getElementById("times");

  const bookingCard =
    document.getElementById("bookingCard");

  const nameInput =
    document.getElementById("name");

  const phoneInput =
    document.getElementById("phone");

  const bookButton =
    document.getElementById("bookButton");

  const message =
    document.getElementById("message");

  const selectedInfo =
    document.getElementById("selectedInfo");


  let selectedTime = null;


  // Fecha mínima = hoy
  const today =
    new Date().toISOString().split("T")[0];

  dateInput.min = today;


  // Formato de hora
  function formatTime(time) {

    const [hour, minute] =
      time.split(":");

    let h = parseInt(hour);

    const ampm =
      h >= 12 ? "PM" : "AM";

    h = h % 12;

    if (h === 0) {
      h = 12;
    }

    return `${h}:${minute} ${ampm}`;
  }


  // Servicio seleccionado
  function getSelectedService() {

    const selected =
      document.querySelector(
        'input[name="service"]:checked'
      );

    return selected
      ? selected.value
      : null;
  }


  // Mostrar información seleccionada
  function updateSelectedInfo() {

    const service =
      getSelectedService();

    if (!service || !selectedTime) {
      selectedInfo.style.display = "none";
      return;
    }

    selectedInfo.innerHTML = `
      <strong>Servicio:</strong> ${service}<br>
      <strong>Horario:</strong> ${formatTime(selectedTime)}
    `;

    selectedInfo.style.display = "block";
  }


  document
    .querySelectorAll('input[name="service"]')
    .forEach(input => {

      input.addEventListener(
        "change",
        updateSelectedInfo
      );

    });


  // Cargar horarios
  async function loadAppointments() {

    const date =
      dateInput.value;

    if (!date) {
      alert("Selecciona una fecha.");
      return;
    }

    timesContainer.innerHTML =
      `<div class="loading">
        Cargando horarios...
      </div>`;

    scheduleCard.style.display =
      "block";

    bookingCard.style.display =
      "none";

    selectedTime = null;

    try {

      const response =
        await fetch(
          `${API_URL}?date=${encodeURIComponent(date)}`,
          {
            method: "GET",
            mode: "cors",
            cache: "no-store"
          }
        );

      const raw =
        await response.text();

      let data;

      try {
        data = JSON.parse(raw);
      } catch {
        throw new Error(
          "Respuesta inválida del servidor."
        );
      }

      if (!response.ok) {
        throw new Error(
          data.error ||
          "No se pudieron cargar las citas."
        );
      }

      const bookedTimes =
        new Set(
          data.map(
            appointment =>
              appointment.appointment_time
          )
        );

      timesContainer.innerHTML = "";

      times.forEach(time => {

        const button =
          document.createElement("button");

        button.type = "button";

        button.className =
          "time-button";

        button.textContent =
          formatTime(time);

        if (bookedTimes.has(time)) {

          button.classList.add("booked");

          button.disabled = true;

        } else {

          button.addEventListener(
            "click",
            () => {

              document
                .querySelectorAll(
                  ".time-button"
                )
                .forEach(btn =>
                  btn.classList.remove(
                    "selected"
                  )
                );

              button.classList.add(
                "selected"
              );

              selectedTime = time;

              bookingCard.style.display =
                "block";

              message.style.display =
                "none";

              updateSelectedInfo();

              bookingCard.scrollIntoView({
                behavior: "smooth",
                block: "start"
              });

            }
          );

        }

        timesContainer.appendChild(button);

      });

    } catch (error) {

      timesContainer.innerHTML = `
        <div class="message error">
          ❌ ${error.message}
        </div>
      `;

    }

  }


  loadButton.addEventListener(
    "click",
    loadAppointments
  );


  // Confirmar cita
  bookButton.addEventListener(
    "click",
    async () => {

      const service =
        getSelectedService();

      const date =
        dateInput.value;

      const name =
        nameInput.value.trim();

      const phone =
        phoneInput.value.trim();


      if (!service) {

        showMessage(
          "❌ Selecciona el servicio que deseas.",
          false
        );

        return;
      }


      if (!date) {

        showMessage(
          "❌ Selecciona una fecha.",
          false
        );

        return;
      }


      if (!selectedTime) {

        showMessage(
          "❌ Selecciona un horario.",
          false
        );

        return;
      }


      if (!name) {

        showMessage(
          "❌ Escribe tu nombre.",
          false
        );

        nameInput.focus();

        return;
      }


      if (!phone) {

        showMessage(
          "❌ Escribe tu teléfono.",
          false
        );

        phoneInput.focus();

        return;
      }


      bookButton.disabled = true;

      bookButton.textContent =
        "Reservando...";

      message.style.display =
        "none";


      try {

        const response =
          await fetch(
            API_URL,
            {
              method: "POST",
              mode: "cors",
              headers: {
                "Content-Type":
                  "text/plain;charset=UTF-8"
              },
              body: JSON.stringify({
                date: date,
                time: selectedTime,
                name: name,
                phone: phone,
                service: service
              })
            }
          );


        const raw =
          await response.text();

        let data;

        try {
          data = JSON.parse(raw);
        } catch {
          throw new Error(
            "Respuesta inválida del servidor."
          );
        }


        if (!response.ok) {

          throw new Error(
            data.error ||
            "No se pudo reservar la cita."
          );

        }


        // MENSAJE DE CONFIRMACIÓN
        message.className =
          "message success";

        message.innerHTML = `
          <strong>✅ ¡Cita confirmada!</strong><br><br>

          Tu cita ha sido reservada correctamente.<br><br>

          <strong>Servicio:</strong><br>
          ${service}<br><br>

          <strong>Fecha:</strong><br>
          ${formatDate(date)}<br><br>

          <strong>Horario:</strong><br>
          ${formatTime(selectedTime)}<br><br>

          <strong>Cliente:</strong><br>
          ${escapeHtml(name)}<br><br>

          <strong>Teléfono:</strong><br>
          ${escapeHtml(phone)}
        `;

        message.style.display =
          "block";


        // Limpiar selección
        selectedTime = null;

        nameInput.value = "";
        phoneInput.value = "";

        selectedInfo.style.display =
          "none";


        // Recargar horarios
        setTimeout(
          loadAppointments,
          500
        );


        message.scrollIntoView({
          behavior: "smooth",
          block: "center"
        });


      } catch (error) {

        showMessage(
          `❌ ${error.message}`,
          false
        );

      } finally {

        bookButton.disabled = false;

        bookButton.textContent =
          "Confirmar cita";

      }

    }
  );


  function showMessage(
    text,
    success
  ) {

    message.className =
      success
        ? "message success"
        : "message error";

    message.innerHTML = text;

    message.style.display =
      "block";

  }


  function formatDate(date) {

    const parts =
      date.split("-");

    if (parts.length !== 3) {
      return date;
    }

    const year =
      parts[0];

    const month =
      parseInt(parts[1], 10);

    const day =
      parseInt(parts[2], 10);

    const months = [
      "enero",
      "febrero",
      "marzo",
      "abril",
      "mayo",
      "junio",
      "julio",
      "agosto",
      "septiembre",
      "octubre",
      "noviembre",
      "diciembre"
    ];

    return `${day} de ${months[month - 1]} de ${year}`;

  }


  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent =
      text;

    return div.innerHTML;

  }

</script>

</body>
</html>
