<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kenier Barber Studio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f3f3;
      color: #111;
    }

    .container {
      width: min(92%, 430px);
      margin: auto;
      padding: 16px 0 40px;
    }

    .header {
      text-align: center;
      padding: 8px 0 18px;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
    }

    .header p {
      margin: 5px 0 0;
      color: #666;
      font-size: 13px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 17px;
      margin-bottom: 13px;
      box-shadow: 0 3px 14px rgba(0,0,0,.07);
    }

    .card h2 {
      margin: 0 0 14px;
      font-size: 18px;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-size: 13px;
      font-weight: 700;
    }

    input,
    select,
    button {
      width: 100%;
      height: 45px;
      border-radius: 11px;
      border: 1px solid #ddd;
      font-size: 14px;
      font-family: inherit;
    }

    input,
    select {
      padding: 0 12px;
      background: #fff;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #111;
    }

    button {
      border: none;
      background: #111;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: .18s ease;
      margin-top: 15px;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: .88;
    }

    button:active {
      transform: scale(.98);
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none;
    }

    .service-select,
    .time-select {
      appearance: auto;
    }

    .schedule {
      display: none;
    }

    .schedule-info {
      font-size: 13px;
      color: #666;
      margin-bottom: 10px;
    }

    .available-message {
      font-size: 13px;
      color: #555;
      margin-top: 10px;
    }

    .booking-card {
      display: none;
    }

    .selected-time {
      background: #f2f2f2;
      border-radius: 10px;
      padding: 11px;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .confirmation {
      display: none;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 13px;
      background: #111;
      color: white;
      box-shadow: 0 5px 20px rgba(0,0,0,.15);
    }

    .confirmation-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #fff;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .confirmation h2 {
      margin: 0 0 6px;
      font-size: 21px;
    }

    .confirmation-subtitle {
      margin: 0 0 16px;
      color: #ccc;
      font-size: 13px;
    }

    .confirmation-details {
      background: rgba(255,255,255,.09);
      border-radius: 12px;
      padding: 13px;
    }

    .detail {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,.12);
      font-size: 13px;
    }

    .detail:last-child {
      border-bottom: none;
    }

    .detail span:first-child {
      color: #bbb;
    }

    .detail span:last-child {
      text-align: right;
      font-weight: 700;
    }

    .new-booking {
      background: #fff;
      color: #111;
      margin-top: 16px;
    }

    .error {
      display: none;
      background: #ffe8e8;
      color: #a00000;
      border-radius: 11px;
      padding: 12px;
      font-size: 13px;
      margin-top: 12px;
    }

    .success-small {
      display: none;
      background: #e9f8ed;
      color: #17652d;
      border-radius: 11px;
      padding: 12px;
      font-size: 13px;
      margin-top: 12px;
    }

    .footer {
      text-align: center;
      color: #888;
      font-size: 11px;
      margin-top: 20px;
    }

    @media (max-width: 360px) {
      .container {
        width: 94%;
      }

      .card {
        padding: 15px;
      }

      .header h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Kenier Barber Studio</h1>
    <p>Reserva tu cita de forma rápida y sencilla</p>
  </div>


  <!-- RESERVA -->
  <div class="card" id="mainCard">

    <h2>Reservar cita</h2>

    <label for="service">Servicio</label>

    <select id="service" class="service-select">
      <option value="">Selecciona un servicio</option>
      <option value="Pelado con estilo — $500">Pelado con estilo — $500</option>
      <option value="Pelado clásico o al cero (personas mayores) — $300">
        Pelado clásico o al cero (personas mayores) — $300
      </option>
      <option value="Pelado para niños (menores de 12 años) — $300">
        Pelado para niños (menores de 12 años) — $300
      </option>
    </select>


    <label for="date">Fecha</label>

    <input
      type="date"
      id="date"
    >


    <label for="time">Horario</label>

    <select id="time" class="time-select" disabled>
      <option value="">Selecciona primero una fecha</option>
    </select>

    <div class="available-message" id="availableMessage"></div>

  </div>


  <!-- DATOS DEL CLIENTE -->
  <div class="card booking-card" id="bookingCard">

    <h2>Datos del cliente</h2>

    <div class="selected-time" id="selectedTime">
      Selecciona un horario
    </div>

    <label for="name">Nombre</label>

    <input
      type="text"
      id="name"
      placeholder="Escribe tu nombre"
      autocomplete="name"
    >


    <label for="phone">Teléfono</label>

    <input
      type="tel"
      id="phone"
      placeholder="Ej. 52612345"
      autocomplete="tel"
    >


    <button id="confirmButton">
      Confirmar cita
    </button>

    <div class="error" id="errorMessage"></div>

  </div>


  <!-- CONFIRMACIÓN -->
  <div class="confirmation" id="confirmationCard">

    <div class="confirmation-icon">
      ✓
    </div>

    <h2>¡Cita confirmada!</h2>

    <p class="confirmation-subtitle">
      Tu cita ha sido reservada correctamente.
    </p>

    <div class="confirmation-details">

      <div class="detail">
        <span>Cliente</span>
        <span id="confirmationName"></span>
      </div>

      <div class="detail">
        <span>Servicio</span>
        <span id="confirmationService"></span>
      </div>

      <div class="detail">
        <span>Fecha</span>
        <span id="confirmationDate"></span>
      </div>

      <div class="detail">
        <span>Hora</span>
        <span id="confirmationTime"></span>
      </div>

    </div>

    <button class="new-booking" id="newBookingButton">
      Reservar otra cita
    </button>

  </div>


  <div class="footer">
    Kenier Barber Studio · Todos los servicios incluyen arreglo de barba y cejas
  </div>

</div>


<script>

  /*
    ==========================================================
    CONFIGURACIÓN
    ==========================================================
  */

  const API_URL =
    "https://kenier-barber-studio.pages.dev/api/appointments";


  /*
    ==========================================================
    ELEMENTOS
    ==========================================================
  */

  const serviceSelect =
    document.getElementById("service");

  const dateInput =
    document.getElementById("date");

  const timeSelect =
    document.getElementById("time");

  const bookingCard =
    document.getElementById("bookingCard");

  const selectedTime =
    document.getElementById("selectedTime");

  const nameInput =
    document.getElementById("name");

  const phoneInput =
    document.getElementById("phone");

  const confirmButton =
    document.getElementById("confirmButton");

  const errorMessage =
    document.getElementById("errorMessage");

  const availableMessage =
    document.getElementById("availableMessage");

  const confirmationCard =
    document.getElementById("confirmationCard");

  const confirmationName =
    document.getElementById("confirmationName");

  const confirmationService =
    document.getElementById("confirmationService");

  const confirmationDate =
    document.getElementById("confirmationDate");

  const confirmationTime =
    document.getElementById("confirmationTime");

  const newBookingButton =
    document.getElementById("newBookingButton");


  /*
    ==========================================================
    HORARIOS
    ==========================================================
  */

  const allTimes = [
    "08:00",
    "09:00",
    "10:00",
    "11:00",
    "12:00",
    "13:00",
    "14:00",
    "15:00",
    "16:00",
    "17:00",
    "18:00"
  ];


  /*
    ==========================================================
    HORA ACTUAL DE CUBA
    ==========================================================
  */

  function getCubaNow() {

    const formatter = new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone: "America/Havana",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }
    );

    const parts =
      formatter.formatToParts(new Date());

    const values = {};

    parts.forEach(part => {
      if (part.type !== "literal") {
        values[part.type] = part.value;
      }
    });

    return {
      date:
        `${values.year}-${values.month}-${values.day}`,

      hour:
        Number(values.hour),

      minute:
        Number(values.minute)
    };
  }


  /*
    ==========================================================
    FECHA MÍNIMA
    ==========================================================
  */

  function setMinimumDate() {

    const cubaNow = getCubaNow();

    dateInput.min = cubaNow.date;

    /*
      Si por alguna razón el teléfono tenía
      una fecha anterior guardada, la corregimos.
    */

    if (
      !dateInput.value ||
      dateInput.value < cubaNow.date
    ) {
      dateInput.value = cubaNow.date;
    }
  }


  /*
    ==========================================================
    COMPROBAR SI UN HORARIO YA PASÓ
    ==========================================================
  */

  function isTimePast(time) {

    const cubaNow = getCubaNow();

    if (dateInput.value !== cubaNow.date) {
      return false;
    }

    const [hour, minute] =
      time.split(":").map(Number);

    const currentMinutes =
      cubaNow.hour * 60 + cubaNow.minute;

    const appointmentMinutes =
      hour * 60 + minute;

    return appointmentMinutes <= currentMinutes;
  }


  /*
    ==========================================================
    FORMATEAR FECHA
    ==========================================================
  */

  function formatDate(dateString) {

    const date =
      new Date(dateString + "T12:00:00");

    return date.toLocaleDateString(
      "es-ES",
      {
        day: "numeric",
        month: "long",
        year: "numeric"
      }
    );
  }


  /*
    ==========================================================
    FORMATEAR HORA
    ==========================================================
  */

  function formatTime(time) {

    const [hourString, minute] =
      time.split(":");

    let hour =
      Number(hourString);

    const suffix =
      hour >= 12 ? "PM" : "AM";

    hour =
      hour % 12 || 12;

    return `${hour}:${minute} ${suffix}`;
  }


  /*
    ==========================================================
    CARGAR HORARIOS DISPONIBLES
    ==========================================================
  */

  async function refreshTimes(date) {

    timeSelect.innerHTML =
      '<option value="">Cargando horarios...</option>';

    timeSelect.disabled = true;

    bookingCard.style.display = "none";

    availableMessage.textContent = "";

    try {

      /*
        Evita que el navegador utilice
        una respuesta vieja.
      */

      const response =
        await fetch(
          `${API_URL}?date=${encodeURIComponent(date)}&t=${Date.now()}`,
          {
            method: "GET",
            cache: "no-store"
          }
        );


      const rawText =
        await response.text();

      let appointments = [];

      try {
        appointments =
          JSON.parse(rawText);
      } catch (e) {
        throw new Error(
          "Respuesta inválida del servidor."
        );
      }


      if (!response.ok) {
        throw new Error(
          appointments.error ||
          "No se pudieron obtener los horarios."
        );
      }


      const occupied =
        new Set(
          appointments.map(
            appointment =>
              appointment.appointment_time
          )
        );


      timeSelect.innerHTML =
        '<option value="">Selecciona un horario</option>';


      let availableCount = 0;


      allTimes.forEach(time => {

        /*
          No mostrar horarios ya reservados.
        */

        if (occupied.has(time)) {
          return;
        }


        /*
          Si es HOY, tampoco mostrar
          horarios que ya pasaron.
        */

        if (isTimePast(time)) {
          return;
        }


        const option =
          document.createElement("option");

        option.value = time;

        option.textContent =
          formatTime(time);

        timeSelect.appendChild(option);

        availableCount++;

      });


      if (availableCount === 0) {

        timeSelect.innerHTML =
          '<option value="">No quedan horarios disponibles</option>';

        timeSelect.disabled = true;

        availableMessage.textContent =
          "No quedan horarios disponibles para esta fecha.";

      } else {

        timeSelect.disabled = false;

        availableMessage.textContent =
          `${availableCount} horario${availableCount === 1 ? "" : "s"} disponible${availableCount === 1 ? "" : "s"}.`;
      }


    } catch (error) {

      timeSelect.innerHTML =
        '<option value="">No se pudieron cargar los horarios</option>';

      timeSelect.disabled = true;

      availableMessage.textContent =
        error.message ||
        "Error conectando con el servidor.";
    }
  }


  /*
    ==========================================================
    CAMBIO DE FECHA
    ==========================================================
  */

  dateInput.addEventListener(
    "change",
    async () => {

      /*
        Volvemos a comprobar la fecha.
        Esto evita que alguien manipule
        el calendario manualmente.
      */

      const cubaNow =
        getCubaNow();

      if (dateInput.value < cubaNow.date) {

        dateInput.value =
          cubaNow.date;

        alert(
          "No puedes seleccionar una fecha pasada."
        );
      }


      confirmationCard.style.display =
        "none";

      await refreshTimes(
        dateInput.value
      );
    }
  );


  /*
    ==========================================================
    CAMBIO DE HORARIO
    ==========================================================
  */

  timeSelect.addEventListener(
    "change",
    () => {

      errorMessage.style.display =
        "none";


      if (!timeSelect.value) {

        bookingCard.style.display =
          "none";

        return;
      }


      selectedTime.textContent =
        `Horario seleccionado: ${formatTime(timeSelect.value)}`;


      bookingCard.style.display =
        "block";


      /*
        Llevar al usuario a la sección
        de datos del cliente.
      */

      setTimeout(() => {

        bookingCard.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });

      }, 100);

    }
  );


  /*
    ==========================================================
    CONFIRMAR CITA
    ==========================================================
  */

  confirmButton.addEventListener(
    "click",
    async () => {

      errorMessage.style.display =
        "none";


      const service =
        serviceSelect.value;

      const date =
        dateInput.value;

      const time =
        timeSelect.value;

      const name =
        nameInput.value.trim();

      const phone =
        phoneInput.value.trim();


      /*
        Validaciones
      */

      if (!service) {

        showError(
          "Selecciona el servicio que deseas."
        );

        return;
      }


      if (!date) {

        showError(
          "Selecciona una fecha."
        );

        return;
      }


      if (!time) {

        showError(
          "Selecciona un horario."
        );

        return;
      }


      if (!name) {

        showError(
          "Escribe tu nombre."
        );

        return;
      }


      if (!phone) {

        showError(
          "Escribe tu número de teléfono."
        );

        return;
      }


      /*
        Comprobar nuevamente que la fecha
        no sea anterior a hoy.
      */

      const cubaNow =
        getCubaNow();


      if (date < cubaNow.date) {

        showError(
          "No puedes reservar una cita para una fecha pasada."
        );

        setMinimumDate();

        await refreshTimes(
          dateInput.value
        );

        return;
      }


      /*
        Comprobar nuevamente que la hora
        no haya pasado si es hoy.
      */

      if (isTimePast(time)) {

        showError(
          "Ese horario ya pasó. Selecciona otro."
        );

        await refreshTimes(date);

        return;
      }


      /*
        Desactivar botón para evitar
        doble reserva.
      */

      confirmButton.disabled = true;

      confirmButton.textContent =
        "Confirmando...";


      try {

        const response =
          await fetch(
            API_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "text/plain;charset=UTF-8"
              },

              body: JSON.stringify({
                date: date,
                time: time,
                name: name,
                phone: phone,
                service: service
              }),

              cache: "no-store"
            }
          );


        const rawText =
          await response.text();


        let result;

        try {

          result =
            JSON.parse(rawText);

        } catch (e) {

          throw new Error(
            "El servidor devolvió una respuesta inválida."
          );
        }


        /*
          Si el horario fue ocupado
          por otra persona.
        */

        if (!response.ok) {

          throw new Error(
            result.error ||
            "No se pudo confirmar la cita."
          );
        }


        if (!result.success) {

          throw new Error(
            result.error ||
            "No se pudo confirmar la cita."
          );
        }


        /*
          ==============================================
          ¡CITA CONFIRMADA!
          ==============================================
        */

        confirmationName.textContent =
          name;

        confirmationService.textContent =
          service;

        confirmationDate.textContent =
          formatDate(date);

        confirmationTime.textContent =
          formatTime(time);


        /*
          MOSTRAR CONFIRMACIÓN
          Y NO OCULTARLA DESPUÉS.
        */

        confirmationCard.style.display =
          "block";


        /*
          Ocultar formulario de datos.
        */

        bookingCard.style.display =
          "none";


        /*
          Volver a actualizar horarios.
          Esto NO oculta la confirmación.
        */

        await refreshTimes(date);


        /*
          Volver a mostrar la confirmación
          por seguridad después de refreshTimes.
        */

        confirmationCard.style.display =
          "block";


        /*
          Subir hasta la confirmación.
        */

        setTimeout(() => {

          confirmationCard.scrollIntoView({
            behavior: "smooth",
            block: "start"
          });

        }, 150);


      } catch (error) {

        showError(
          error.message ||
          "No se pudo confirmar la cita."
        );

      } finally {

        confirmButton.disabled =
          false;

        confirmButton.textContent =
          "Confirmar cita";
      }

    }
  );


  /*
    ==========================================================
    MOSTRAR ERROR
    ==========================================================
  */

  function showError(message) {

    errorMessage.textContent =
      message;

    errorMessage.style.display =
      "block";


    errorMessage.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });
  }


  /*
    ==========================================================
    NUEVA CITA
    ==========================================================
  */

  newBookingButton.addEventListener(
    "click",
    async () => {

      confirmationCard.style.display =
        "none";

      bookingCard.style.display =
        "none";

      serviceSelect.value =
        "";

      nameInput.value =
        "";

      phoneInput.value =
        "";

      timeSelect.value =
        "";

      errorMessage.style.display =
        "none";


      setMinimumDate();

      await refreshTimes(
        dateInput.value
      );


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }
  );


  /*
    ==========================================================
    INICIALIZACIÓN
    ==========================================================
  */

  setMinimumDate();

  refreshTimes(
    dateInput.value
  );


  /*
    ==========================================================
    ACTUALIZAR AUTOMÁTICAMENTE LOS HORARIOS
    CADA 60 SEGUNDOS
    ==========================================================
  */

  setInterval(
    async () => {

      /*
        Esto es especialmente importante
        si alguien deja la página abierta
        durante mucho tiempo.
      */

      setMinimumDate();

      if (dateInput.value) {

        await refreshTimes(
          dateInput.value
        );

      }

    },
    60000
  );

</script>

</body>
</html>
