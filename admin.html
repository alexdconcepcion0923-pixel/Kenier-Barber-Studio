<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kenier Barber Studio - Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #111;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .login-box,
    .admin-box {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .admin-box {
      display: none;
    }

    input,
    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 10px;
      font-size: 16px;
    }

    input {
      border: 1px solid #ccc;
    }

    button {
      border: none;
      background: #111;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .logout {
      background: #777;
      margin-bottom: 20px;
    }

    .error {
      color: #d00;
      margin-top: 12px;
      text-align: center;
    }

    .success {
      color: green;
      margin-top: 12px;
      text-align: center;
    }

    .date-title {
      font-weight: bold;
      margin-top: 20px;
      margin-bottom: 10px;
    }

    .appointment {
      background: #f7f7f7;
      padding: 15px;
      border-radius: 12px;
      margin-top: 12px;
    }

    .appointment strong {
      font-size: 18px;
    }

    .cancel {
      background: #c62828;
      margin-top: 12px;
    }

    .empty {
      text-align: center;
      padding: 20px;
      color: #777;
    }

    .summary {
      background: #111;
      color: white;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      margin: 15px 0;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Kenier Barber Studio</h1>

  <!-- LOGIN -->
  <div class="login-box" id="loginBox">

    <h2>Panel de administrador</h2>

    <input
      type="password"
      id="password"
      placeholder="Contraseña"
      autocomplete="current-password"
    >

    <button onclick="login()">
      Entrar
    </button>

    <div id="loginMessage"></div>

  </div>


  <!-- ADMIN -->
  <div class="admin-box" id="adminBox">

    <button class="logout" onclick="logout()">
      Cerrar sesión
    </button>

    <label for="date">
      <strong>Seleccionar fecha</strong>
    </label>

    <input
      type="date"
      id="date"
      onchange="loadAppointments()"
    >

    <div class="summary" id="summary">
      Cargando...
    </div>

    <div id="appointments"></div>

  </div>

</div>


<script>

  const loginBox = document.getElementById("loginBox");
  const adminBox = document.getElementById("adminBox");
  const loginMessage = document.getElementById("loginMessage");
  const passwordInput = document.getElementById("password");

  const dateInput = document.getElementById("date");
  const appointmentsContainer =
    document.getElementById("appointments");

  const summary =
    document.getElementById("summary");


  // FECHA DE HOY
  const today = new Date();

  const year = today.getFullYear();
  const month = String(today.getMonth() + 1).padStart(2, "0");
  const day = String(today.getDate()).padStart(2, "0");

  const todayString = `${year}-${month}-${day}`;

  dateInput.value = todayString;
  dateInput.min = todayString;


  // VERIFICAR SESIÓN
  function checkLogin() {

    if (
      document.cookie.includes(
        "admin_auth=authenticated"
      )
    ) {

      loginBox.style.display = "none";
      adminBox.style.display = "block";

      loadAppointments();

    }

  }


  // LOGIN
  async function login() {

    const password =
      passwordInput.value.trim();

    if (!password) {

      loginMessage.innerHTML =
        '<div class="error">Escribe la contraseña.</div>';

      return;

    }


    try {

      const response = await fetch(
        "/api/admin-login",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            password: password
          })
        }
      );


      const data =
        await response.json();


      if (!response.ok) {

        loginMessage.innerHTML =
          `<div class="error">${data.error || "Contraseña incorrecta."}</div>`;

        return;

      }


      loginBox.style.display = "none";
      adminBox.style.display = "block";

      passwordInput.value = "";

      loadAppointments();


    } catch (error) {

      loginMessage.innerHTML =
        '<div class="error">No se pudo conectar con el servidor.</div>';

    }

  }


  // ENTER PARA LOGIN
  passwordInput.addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {
        login();
      }

    }
  );


  // CARGAR CITAS
  async function loadAppointments() {

    const date =
      dateInput.value;

    if (!date) return;


    appointmentsContainer.innerHTML =
      "<p>Cargando citas...</p>";


    try {

      const response =
        await fetch(
          `/api/appointments?date=${date}`
        );


      const data =
        await response.json();


      if (!response.ok) {

        appointmentsContainer.innerHTML =
          `<div class="error">${data.error || "Error cargando citas."}</div>`;

        return;

      }


      const appointments =
        data.appointments || [];


      summary.textContent =
        `${appointments.length} cita${appointments.length === 1 ? "" : "s"} para este día`;


      appointmentsContainer.innerHTML = "";


      if (appointments.length === 0) {

        appointmentsContainer.innerHTML =
          '<div class="empty">No hay citas reservadas para este día.</div>';

        return;

      }


      appointments.forEach(
        appointment => {

          const div =
            document.createElement("div");

          div.className =
            "appointment";


          div.innerHTML = `

            <strong>
              ${formatTime(appointment.appointment_time)}
            </strong>

            <br><br>

            <strong>Cliente:</strong>
            ${escapeHtml(appointment.client_name)}

            <br>

            <strong>Teléfono:</strong>
            ${escapeHtml(appointment.client_phone)}

            <br>

            <strong>Estado:</strong>
            ${escapeHtml(appointment.status)}

            <button
              class="cancel"
              onclick="cancelAppointment(${appointment.id})"
            >
              Cancelar cita
            </button>

          `;


          appointmentsContainer.appendChild(div);

        }
      );


    } catch (error) {

      appointmentsContainer.innerHTML =
        '<div class="error">Error conectando con el servidor.</div>';

    }

  }


  // CANCELAR CITA
  async function cancelAppointment(id) {

    const confirmCancel =
      confirm(
        "¿Seguro que quieres cancelar esta cita?"
      );


    if (!confirmCancel) return;


    try {

      const response =
        await fetch(
          "/api/appointments",
          {
            method: "DELETE",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              id: id
            })
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        alert(
          data.error ||
          "No se pudo cancelar la cita."
        );

        return;

      }


      alert(
        "Cita cancelada correctamente."
      );


      loadAppointments();


    } catch (error) {

      alert(
        "No se pudo conectar con el servidor."
      );

    }

  }


  // FORMATO DE HORA
  function formatTime(time) {

    const [hour, minute] =
      time.split(":");

    let h = parseInt(hour);

    const ampm =
      h >= 12 ? "PM" : "AM";

    h =
      h % 12 || 12;

    return `${h}:${minute} ${ampm}`;

  }


  // SEGURIDAD HTML
  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent =
      text;

    return div.innerHTML;

  }


  // CERRAR SESIÓN
  function logout() {

    document.cookie =
      "admin_auth=; Path=/; Max-Age=0";

    adminBox.style.display = "none";
    loginBox.style.display = "block";

  }


  checkLogin();

</script>

</body>
</html>
