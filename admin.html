<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin - Kenier Barber Studio</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 15px 40px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .container {
      max-width: 760px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 38px;
      margin: 15px 0 35px;
    }

    .card {
      background: white;
      border-radius: 25px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      font-weight: 700;
      font-size: 18px;
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      padding: 17px;
      border: 2px solid #ddd;
      border-radius: 15px;
      font-size: 18px;
      margin-bottom: 15px;
      background: white;
    }

    button {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 15px;
      background: #111;
      color: white;
      font-size: 19px;
      font-weight: 700;
      cursor: pointer;
    }

    .summary {
      background: #111;
      color: white;
      border-radius: 18px;
      padding: 20px;
      text-align: center;
      font-size: 20px;
      margin-bottom: 20px;
    }

    .appointment {
      background: #fafafa;
      border: 2px solid #ddd;
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 18px;
    }

    .time {
      font-size: 29px;
      font-weight: 800;
      margin-bottom: 20px;
    }

    .info {
      font-size: 18px;
      line-height: 1.7;
    }

    .service {
      font-weight: 700;
      font-size: 19px;
      margin-bottom: 12px;
    }

    .cancel {
      background: #c63832;
      margin-top: 20px;
    }

    .empty {
      text-align: center;
      padding: 25px;
      color: #666;
      font-size: 18px;
    }

    .error {
      background: #ffe8e8;
      color: #a00000;
      padding: 18px;
      border-radius: 15px;
      line-height: 1.5;
      margin-top: 15px;
    }

    .success {
      background: #e8f7e8;
      color: #176b17;
      padding: 18px;
      border-radius: 15px;
      margin-top: 15px;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>Kenier Barber Studio</h1>


  <div class="card">

    <label for="date">
      Seleccionar fecha
    </label>

    <input
      type="date"
      id="date"
    >

    <button
      id="loadButton"
      type="button"
    >
      Actualizar citas
    </button>

  </div>


  <div
    id="summary"
    class="summary"
  >
    Cargando...
  </div>


  <div id="appointments"></div>

</div>


<script>

  const API_URL =
    "https://kenier-barber-studio.pages.dev/api/appointments";


  const dateInput =
    document.getElementById("date");

  const loadButton =
    document.getElementById("loadButton");

  const summary =
    document.getElementById("summary");

  const appointmentsContainer =
    document.getElementById("appointments");


  const today =
    new Date().toISOString().split("T")[0];

  dateInput.value =
    today;

  dateInput.min =
    today;


  function formatTime(time) {

    const [hour, minute] =
      time.split(":");

    let h =
      parseInt(hour);

    const ampm =
      h >= 12 ? "PM" : "AM";

    h =
      h % 12;

    if (h === 0) {
      h = 12;
    }

    return `${h}:${minute} ${ampm}`;

  }


  function formatDate(date) {

    const parts =
      date.split("-");

    const year =
      parts[0];

    const month =
      parseInt(parts[1], 10);

    const day =
      parseInt(parts[2], 10);

    const months = [
      "enero",
      "febrero",
      "marzo",
      "abril",
      "mayo",
      "junio",
      "julio",
      "agosto",
      "septiembre",
      "octubre",
      "noviembre",
      "diciembre"
    ];

    return `${day} de ${months[month - 1]} de ${year}`;

  }


  async function loadAppointments() {

    const date =
      dateInput.value;

    if (!date) {
      return;
    }


    summary.textContent =
      "Cargando...";

    appointmentsContainer.innerHTML =
      "";


    try {

      const response =
        await fetch(
          `${API_URL}?date=${encodeURIComponent(date)}`,
          {
            method: "GET",
            mode: "cors",
            cache: "no-store"
          }
        );


      const raw =
        await response.text();


      let data;

      try {

        data =
          JSON.parse(raw);

      } catch {

        throw new Error(
          "Respuesta inválida del servidor."
        );

      }


      if (!response.ok) {

        throw new Error(
          data.error ||
          "No se pudieron cargar las citas."
        );

      }


      summary.textContent =
        `${data.length} ${
          data.length === 1
            ? "cita"
            : "citas"
        } para este día`;


      if (data.length === 0) {

        appointmentsContainer.innerHTML = `
          <div class="card empty">
            No hay citas reservadas para
            ${formatDate(date)}.
          </div>
        `;

        return;
      }


      data.forEach(
        appointment => {

          const card =
            document.createElement("div");

          card.className =
            "appointment";


          const service =
            appointment.service ||
            "Pelado clásico o al cero — $300 pesos";


          card.innerHTML = `

            <div class="time">
              ${formatTime(
                appointment.appointment_time
              )}
            </div>

            <div class="service">
              💈 ${escapeHtml(service)}
            </div>

            <div class="info">

              <strong>Cliente:</strong>
              ${escapeHtml(
                appointment.client_name
              )}
              <br>

              <strong>Teléfono:</strong>
              ${escapeHtml(
                appointment.client_phone
              )}
              <br>

              <strong>Estado:</strong>
              ${escapeHtml(
                appointment.status
              )}

            </div>

            <button
              class="cancel"
              type="button"
            >
              Cancelar cita
            </button>

          `;


          const cancelButton =
            card.querySelector(
              ".cancel"
            );


          cancelButton.addEventListener(
            "click",
            () =>
              cancelAppointment(
                appointment.id
              )
          );


          appointmentsContainer
            .appendChild(card);

        }
      );


    } catch (error) {

      summary.textContent =
        "Error";

      appointmentsContainer.innerHTML = `
        <div class="error">
          ❌ Error conectando con el servidor.
          <br><br>
          ${escapeHtml(
            error.message
          )}
        </div>
      `;

    }

  }


  async function cancelAppointment(id) {

    const confirmCancel =
      confirm(
        "¿Seguro que quieres cancelar esta cita?"
      );


    if (!confirmCancel) {
      return;
    }


    try {

      const response =
        await fetch(
          API_URL,
          {
            method: "DELETE",
            mode: "cors",
            headers: {
              "Content-Type":
                "text/plain;charset=UTF-8"
            },
            body: JSON.stringify({
              id: id
            })
          }
        );


      const raw =
        await response.text();


      let data;

      try {

        data =
          JSON.parse(raw);

      } catch {

        throw new Error(
          "Respuesta inválida del servidor."
        );

      }


      if (!response.ok) {

        throw new Error(
          data.error ||
          "No se pudo cancelar la cita."
        );

      }


      await loadAppointments();

    } catch (error) {

      alert(
        "No se pudo cancelar la cita: " +
        error.message
      );

    }

  }


  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent =
      text ?? "";

    return div.innerHTML;

  }


  loadButton.addEventListener(
    "click",
    loadAppointments
  );


  dateInput.addEventListener(
    "change",
    loadAppointments
  );


  loadAppointments();

</script>

</body>

</html>
