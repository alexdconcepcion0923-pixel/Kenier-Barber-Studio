<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kenier Barber Studio - Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #111;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .admin-box {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      margin-bottom: 5px;
    }

    input,
    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 10px;
      font-size: 16px;
    }

    input {
      border: 1px solid #ccc;
      background: white;
    }

    button {
      border: none;
      background: #111;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .refresh {
      margin-bottom: 20px;
    }

    .appointment {
      background: #f7f7f7;
      padding: 15px;
      border-radius: 12px;
      margin-top: 12px;
      border: 1px solid #e5e5e5;
    }

    .appointment strong.time {
      display: block;
      font-size: 22px;
      margin-bottom: 15px;
    }

    .cancel {
      background: #c62828;
      margin-top: 15px;
    }

    .empty {
      text-align: center;
      padding: 20px;
      color: #777;
    }

    .summary {
      background: #111;
      color: white;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      margin: 15px 0;
    }

    .error {
      background: #ffe5e5;
      color: #b00000;
      text-align: center;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
      word-break: break-word;
    }

    .success {
      background: #e5f8eb;
      color: #16803c;
      text-align: center;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
    }

    .loading {
      text-align: center;
      color: #777;
      padding: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Kenier Barber Studio</h1>

  <div class="admin-box">

    <label for="date">
      <strong>Seleccionar fecha</strong>
    </label>

    <input
      type="date"
      id="date"
    >

    <button
      class="refresh"
      id="refreshBtn"
      type="button"
    >
      Actualizar citas
    </button>

    <div
      class="summary"
      id="summary"
    >
      Cargando...
    </div>

    <div id="appointments"></div>

  </div>

</div>


<script>

/*
====================================================
  URL DEL BACKEND
====================================================
*/

const API_URL =
  "https://kenier-barber-studio.pages.dev/api/appointments";


/*
====================================================
  ELEMENTOS DE LA PÁGINA
====================================================
*/

const dateInput =
  document.getElementById("date");

const appointmentsContainer =
  document.getElementById("appointments");

const summary =
  document.getElementById("summary");

const refreshBtn =
  document.getElementById("refreshBtn");


/*
====================================================
  FECHA DE HOY
====================================================
*/

function getToday() {

  const today = new Date();

  const year =
    today.getFullYear();

  const month =
    String(today.getMonth() + 1)
      .padStart(2, "0");

  const day =
    String(today.getDate())
      .padStart(2, "0");

  return `${year}-${month}-${day}`;

}


const todayString =
  getToday();


dateInput.value =
  todayString;

dateInput.min =
  todayString;


/*
====================================================
  CARGAR CITAS
====================================================
*/

async function loadAppointments() {

  const date =
    dateInput.value;

  if (!date) {

    summary.textContent =
      "Selecciona una fecha.";

    return;

  }


  refreshBtn.disabled =
    true;

  refreshBtn.textContent =
    "Cargando...";


  appointmentsContainer.innerHTML =
    `<div class="loading">
      Cargando citas...
    </div>`;


  summary.textContent =
    "Cargando...";


  try {

    /*
      PETICIÓN DIRECTA A CLOUDFLARE

      No usamos /api/appointments porque
      esta página está en GitHub Pages.
    */

    const url =
      API_URL +
      "?date=" +
      encodeURIComponent(date);


    const response =
      await fetch(
        url,
        {
          method: "GET",
          mode: "cors",
          cache: "no-store"
        }
      );


    /*
      LEER COMO TEXTO PRIMERO

      Esto evita errores de Safari si
      la respuesta no es JSON.
    */

    const raw =
      await response.text();


    let data = {};


    try {

      data =
        raw
          ? JSON.parse(raw)
          : {};

    } catch (parseError) {

      throw new Error(
        "El servidor no devolvió JSON. " +
        "Respuesta: " +
        raw.substring(0, 300)
      );

    }


    /*
      COMPROBAR ERROR DEL SERVIDOR
    */

    if (!response.ok) {

      throw new Error(
        data.error ||
        `Error del servidor (${response.status})`
      );

    }


    /*
      OBTENER CITAS
    */

    const appointments =
      data.appointments || [];


    /*
      MOSTRAR RESUMEN
    */

    summary.textContent =
      `${appointments.length} cita${
        appointments.length === 1
          ? ""
          : "s"
      } para este día`;


    appointmentsContainer.innerHTML =
      "";


    /*
      SI NO HAY CITAS
    */

    if (appointments.length === 0) {

      appointmentsContainer.innerHTML =
        `<div class="empty">
          No hay citas reservadas para este día.
        </div>`;

      return;

    }


    /*
      MOSTRAR CADA CITA
    */

    appointments.forEach(
      appointment => {

        const div =
          document.createElement("div");


        div.className =
          "appointment";


        div.innerHTML = `

          <strong class="time">
            ${formatTime(
              appointment.appointment_time
            )}
          </strong>

          <strong>Cliente:</strong>
          ${escapeHtml(
            appointment.client_name
          )}

          <br><br>

          <strong>Teléfono:</strong>
          ${escapeHtml(
            appointment.client_phone
          )}

          <br><br>

          <strong>Estado:</strong>
          ${escapeHtml(
            appointment.status
          )}

          <button
            class="cancel"
            type="button"
            onclick="cancelAppointment(${appointment.id})"
          >
            Cancelar cita
          </button>

        `;


        appointmentsContainer
          .appendChild(div);

      }
    );


  } catch (error) {

    console.error(
      "Error cargando citas:",
      error
    );


    summary.textContent =
      "Error";


    appointmentsContainer.innerHTML =
      `<div class="error">
        ❌ Error conectando con el servidor.<br><br>
        ${escapeHtml(error.message)}
      </div>`;


  } finally {

    refreshBtn.disabled =
      false;

    refreshBtn.textContent =
      "Actualizar citas";

  }

}


/*
====================================================
  CANCELAR CITA
====================================================
*/

async function cancelAppointment(id) {

  const confirmCancel =
    confirm(
      "¿Seguro que quieres cancelar esta cita?"
    );


  if (!confirmCancel) {
    return;
  }


  try {

    /*
      DESACTIVAR BOTÓN MIENTRAS SE CANCELA
    */

    const buttons =
      document.querySelectorAll(".cancel");


    buttons.forEach(
      button => {
        button.disabled = true;
      }
    );


    /*
      DELETE DIRECTAMENTE A CLOUDFLARE

      Usamos text/plain para evitar
      el preflight de CORS en Safari.
    */

    const response =
      await fetch(
        API_URL,
        {
          method: "DELETE",

          mode: "cors",

          headers: {
            "Content-Type":
              "text/plain;charset=UTF-8"
          },

          body: JSON.stringify({
            id: id
          })
        }
      );


    /*
      LEER RESPUESTA COMO TEXTO
    */

    const raw =
      await response.text();


    let data = {};


    try {

      data =
        raw
          ? JSON.parse(raw)
          : {};

    } catch (parseError) {

      throw new Error(
        "El servidor no devolvió JSON. " +
        "Respuesta: " +
        raw.substring(0, 300)
      );

    }


    /*
      COMPROBAR ERROR
    */

    if (!response.ok) {

      throw new Error(
        data.error ||
        `Error del servidor (${response.status})`
      );

    }


    /*
      ÉXITO
    */

    alert(
      "✅ Cita cancelada correctamente."
    );


    /*
      RECARGAR CITAS

      El horario eliminado quedará
      disponible nuevamente.
    */

    await loadAppointments();


  } catch (error) {

    console.error(
      "Error cancelando cita:",
      error
    );


    alert(
      "❌ No se pudo cancelar la cita.\n\n" +
      error.message
    );


    /*
      VOLVER A ACTIVAR BOTONES
    */

    const buttons =
      document.querySelectorAll(".cancel");


    buttons.forEach(
      button => {
        button.disabled = false;
      }
    );

  }

}


/*
====================================================
  FORMATO DE HORA
====================================================
*/

function formatTime(time) {

  const parts =
    time.split(":");


  let hour =
    parseInt(parts[0], 10);


  const minute =
    parts[1];


  const ampm =
    hour >= 12
      ? "PM"
      : "AM";


  hour =
    hour % 12 || 12;


  return `${hour}:${minute} ${ampm}`;

}


/*
====================================================
  PROTEGER TEXTO CONTRA HTML
====================================================
*/

function escapeHtml(text) {

  const div =
    document.createElement("div");


  div.textContent =
    text ?? "";


  return div.innerHTML;

}


/*
====================================================
  CAMBIAR FECHA
====================================================
*/

dateInput.addEventListener(
  "change",
  loadAppointments
);


/*
====================================================
  BOTÓN ACTUALIZAR
====================================================
*/

refreshBtn.addEventListener(
  "click",
  loadAppointments
);


/*
====================================================
  CARGAR CITAS AL ABRIR
====================================================
*/

loadAppointments();

</script>

</body>
</html>
