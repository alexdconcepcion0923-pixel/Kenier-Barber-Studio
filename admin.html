<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kenier Barber Studio - Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #111;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .admin-box {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    input,
    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 10px;
      font-size: 16px;
    }

    input {
      border: 1px solid #ccc;
    }

    button {
      border: none;
      background: #111;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .refresh {
      margin-bottom: 20px;
    }

    .appointment {
      background: #f7f7f7;
      padding: 15px;
      border-radius: 12px;
      margin-top: 12px;
    }

    .appointment strong {
      font-size: 18px;
    }

    .cancel {
      background: #c62828;
      margin-top: 12px;
    }

    .empty {
      text-align: center;
      padding: 20px;
      color: #777;
    }

    .summary {
      background: #111;
      color: white;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      margin: 15px 0;
    }

    .error {
      color: #d00;
      text-align: center;
      padding: 15px;
    }

    .success {
      color: #16803c;
      text-align: center;
      padding: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Kenier Barber Studio</h1>

  <div class="admin-box">

    <label for="date">
      <strong>Seleccionar fecha</strong>
    </label>

    <input
      type="date"
      id="date"
    >

    <button
      class="refresh"
      id="refreshBtn"
      onclick="loadAppointments()"
    >
      Actualizar citas
    </button>

    <div class="summary" id="summary">
      Cargando...
    </div>

    <div id="appointments"></div>

  </div>

</div>


<script>


/*
  BACKEND DE CLOUDFLARE

  IMPORTANTE:
  Este es el mismo backend que utiliza
  la página principal.
*/

const API_URL =
  "https://kenier-barber-studio.pages.dev/api/appointments";


const dateInput =
  document.getElementById("date");

const appointmentsContainer =
  document.getElementById("appointments");

const summary =
  document.getElementById("summary");

const refreshBtn =
  document.getElementById("refreshBtn");


/*
  FECHA DE HOY
*/

function getToday() {

  const today =
    new Date();

  const year =
    today.getFullYear();

  const month =
    String(today.getMonth() + 1)
      .padStart(2, "0");

  const day =
    String(today.getDate())
      .padStart(2, "0");

  return `${year}-${month}-${day}`;

}


const todayString =
  getToday();


dateInput.value =
  todayString;

dateInput.min =
  todayString;


/*
  CARGAR CITAS
*/

async function loadAppointments() {

  const date =
    dateInput.value;

  if (!date) {
    return;
  }


  refreshBtn.disabled =
    true;

  refreshBtn.textContent =
    "Cargando...";


  appointmentsContainer.innerHTML =
    "<p style='text-align:center;'>Cargando citas...</p>";

  summary.textContent =
    "Cargando...";


  try {

    const response =
      await fetch(
        `${API_URL}?date=${encodeURIComponent(date)}`
      );


    /*
      LEER COMO TEXTO PRIMERO

      Esto evita errores de Safari
      si la respuesta no es JSON.
    */

    const raw =
      await response.text();


    let data = {};


    try {

      data =
        raw
          ? JSON.parse(raw)
          : {};

    } catch (error) {

      throw new Error(
        `Respuesta del servidor (${response.status}): ${raw.slice(0, 300)}`
      );

    }


    if (!response.ok) {

      throw new Error(
        data.error ||
        `Error del servidor (${response.status})`
      );

    }


    const appointments =
      data.appointments || [];


    /*
      RESUMEN
    */

    summary.textContent =
      `${appointments.length} cita${
        appointments.length === 1
          ? ""
          : "s"
      } para este día`;


    appointmentsContainer.innerHTML =
      "";


    /*
      NO HAY CITAS
    */

    if (appointments.length === 0) {

      appointmentsContainer.innerHTML =
        `<div class="empty">
          No hay citas reservadas para este día.
        </div>`;

      return;

    }


    /*
      MOSTRAR CITAS
    */

    appointments.forEach(
      appointment => {

        const div =
          document.createElement("div");


        div.className =
          "appointment";


        div.innerHTML = `

          <strong>
            ${formatTime(
              appointment.appointment_time
            )}
          </strong>

          <br><br>

          <strong>Cliente:</strong>
          ${escapeHtml(
            appointment.client_name
          )}

          <br>

          <strong>Teléfono:</strong>
          ${escapeHtml(
            appointment.client_phone
          )}

          <br>

          <strong>Estado:</strong>
          ${escapeHtml(
            appointment.status
          )}

          <button
            class="cancel"
            onclick="cancelAppointment(${appointment.id})"
          >
            Cancelar cita
          </button>

        `;


        appointmentsContainer
          .appendChild(div);

      }
    );


  } catch (error) {

    console.error(
      "Error cargando citas:",
      error
    );


    summary.textContent =
      "Error";


    appointmentsContainer.innerHTML =
      `<div class="error">
        ❌ No se pudieron cargar las citas.<br><br>
        ${escapeHtml(error.message)}
      </div>`;


  } finally {

    refreshBtn.disabled =
      false;

    refreshBtn.textContent =
      "Actualizar citas";

  }

}


/*
  CANCELAR CITA
*/

async function cancelAppointment(id) {

  const confirmCancel =
    confirm(
      "¿Seguro que quieres cancelar esta cita?"
    );


  if (!confirmCancel) {
    return;
  }


  try {

    /*
      IMPORTANTE:

      Usamos text/plain para evitar
      problemas de CORS/preflight
      en Safari.

      El backend sigue leyendo
      el contenido como JSON.
    */

    const response =
      await fetch(
        API_URL,
        {

          method: "DELETE",

          headers: {

            "Content-Type":
              "text/plain;charset=UTF-8"

          },

          body: JSON.stringify({

            id: id

          })

        }
      );


    /*
      LEER RESPUESTA COMO TEXTO
    */

    const raw =
      await response.text();


    let data = {};


    try {

      data =
        raw
          ? JSON.parse(raw)
          : {};

    } catch (error) {

      throw new Error(
        `Respuesta del servidor (${response.status}): ${raw.slice(0, 300)}`
      );

    }


    /*
      ERROR
    */

    if (!response.ok) {

      throw new Error(
        data.error ||
        `Error del servidor (${response.status})`
      );

    }


    /*
      ÉXITO
    */

    alert(
      "✅ Cita cancelada correctamente."
    );


    /*
      RECARGAR LAS CITAS

      La hora quedará disponible
      nuevamente para los clientes.
    */

    await loadAppointments();


  } catch (error) {

    console.error(
      "Error cancelando cita:",
      error
    );


    alert(
      "❌ No se pudo cancelar la cita.\n\n" +
      error.message
    );

  }

}


/*
  FORMATO DE HORA
*/

function formatTime(time) {

  const parts =
    time.split(":");

  let hour =
    parseInt(parts[0], 10);

  const minute =
    parts[1];

  const ampm =
    hour >= 12
      ? "PM"
      : "AM";


  hour =
    hour % 12 || 12;


  return `${hour}:${minute} ${ampm}`;

}


/*
  PROTEGER TEXTO HTML
*/

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text ?? "";

  return div.innerHTML;

}


/*
  CAMBIO DE FECHA
*/

dateInput.addEventListener(
  "change",
  loadAppointments
);


/*
  CARGAR AUTOMÁTICAMENTE
*/

loadAppointments();


</script>

</body>
</html>
