<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kenier Barber Studio | Panel</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f5f5f5;
  color: #111;
}

.container {
  width: min(94%, 600px);
  margin: auto;
  padding: 25px 0 40px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 22px;
  box-shadow: 0 4px 20px rgba(0,0,0,.08);
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 20px;
}

h1 {
  margin: 0;
  font-size: 24px;
}

.subtitle {
  color: #666;
  margin-top: 5px;
}

.refresh {
  border: 0;
  background: #111;
  color: white;
  padding: 11px 14px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
}

input[type="date"] {
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
  background: white;
}

.summary {
  margin: 20px 0;
  padding: 15px;
  background: #f1f1f1;
  border-radius: 12px;
  text-align: center;
  font-weight: bold;
}

.appointments {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.appointment {
  border: 1px solid #ddd;
  border-radius: 14px;
  padding: 16px;
  background: white;
}

.appointment-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.time {
  font-size: 20px;
  font-weight: bold;
}

.status {
  background: #e8f7e8;
  color: #176117;
  padding: 5px 9px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: bold;
}

.client {
  margin-top: 12px;
  font-size: 17px;
  font-weight: bold;
}

.phone {
  margin-top: 5px;
  color: #666;
}

.cancel {
  width: 100%;
  margin-top: 14px;
  padding: 11px;
  border: 0;
  border-radius: 9px;
  background: #eee;
  color: #9b1111;
  font-weight: bold;
  cursor: pointer;
}

.empty {
  text-align: center;
  padding: 30px 15px;
  color: #666;
  background: #f7f7f7;
  border-radius: 12px;
}

.loading {
  text-align: center;
  padding: 25px;
  color: #666;
}

.error {
  margin-top: 15px;
  padding: 14px;
  border-radius: 10px;
  background: #ffe9e9;
  color: #8a1111;
  text-align: center;
}

@media (max-width: 400px) {
  .header {
    align-items: flex-start;
  }

  h1 {
    font-size: 21px;
  }

  .refresh {
    padding: 9px 11px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="card">

    <div class="header">

      <div>
        <h1>Kenier Barber Studio</h1>

        <div class="subtitle">
          Panel de citas
        </div>
      </div>

      <button
        class="refresh"
        id="refresh"
        type="button"
      >
        🔄
      </button>

    </div>


    <label for="date">
      Selecciona el día
    </label>

    <input
      type="date"
      id="date"
    >


    <div
      class="summary"
      id="summary"
    >
      Cargando citas...
    </div>


    <div
      class="appointments"
      id="appointments"
    >
    </div>


    <div
      class="error"
      id="error"
      style="display:none;"
    >
    </div>

  </div>

</div>


<script>

const dateInput =
  document.getElementById("date");

const appointmentsContainer =
  document.getElementById("appointments");

const summary =
  document.getElementById("summary");

const refreshButton =
  document.getElementById("refresh");

const errorBox =
  document.getElementById("error");


/* =========================
   FECHA DE HOY
========================= */

function getToday() {

  const now = new Date();

  const year =
    now.getFullYear();

  const month =
    String(now.getMonth() + 1)
      .padStart(2, "0");

  const day =
    String(now.getDate())
      .padStart(2, "0");

  return `${year}-${month}-${day}`;
}


dateInput.value =
  getToday();

dateInput.min =
  getToday();


/* =========================
   FORMATO DE HORA
========================= */

function formatTime(time) {

  const hour =
    Number(time.split(":")[0]);

  if (hour === 12) {
    return "12:00 PM";
  }

  if (hour > 12) {
    return `${hour - 12}:00 PM`;
  }

  return `${hour}:00 AM`;
}


/* =========================
   MOSTRAR ERROR
========================= */

function showError(text) {

  errorBox.textContent =
    text;

  errorBox.style.display =
    "block";

}


/* =========================
   OCULTAR ERROR
========================= */

function hideError() {

  errorBox.textContent =
    "";

  errorBox.style.display =
    "none";

}


/* =========================
   CARGAR CITAS
========================= */

async function loadAppointments() {

  hideError();

  appointmentsContainer.innerHTML =
    `<div class="loading">Cargando citas...</div>`;

  summary.textContent =
    "Cargando citas...";


  try {

    const response =
      await fetch(
        `/api/appointments?date=${encodeURIComponent(dateInput.value)}`
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "No se pudieron cargar las citas."
      );

    }


    const appointments =
      data.appointments || [];


    appointmentsContainer.innerHTML =
      "";


    if (appointments.length === 0) {

      summary.textContent =
        "No hay citas para este día.";

      appointmentsContainer.innerHTML =
        `<div class="empty">
          📅 No hay citas reservadas.
        </div>`;

      return;

    }


    summary.textContent =
      `${appointments.length} cita${appointments.length === 1 ? "" : "s"} reservada${appointments.length === 1 ? "" : "s"}`;


    appointments.forEach(
      appointment => {

        const card =
          document.createElement("div");

        card.className =
          "appointment";


        const top =
          document.createElement("div");

        top.className =
          "appointment-top";


        const time =
          document.createElement("div");

        time.className =
          "time";

        time.textContent =
          formatTime(
            appointment.appointment_time
          );


        const status =
          document.createElement("div");

        status.className =
          "status";

        status.textContent =
          "CONFIRMADA";


        top.appendChild(time);

        top.appendChild(status);


        const client =
          document.createElement("div");

        client.className =
          "client";

        client.textContent =
          appointment.client_name;


        const phone =
          document.createElement("div");

        phone.className =
          "phone";

        phone.textContent =
          "📱 " +
          appointment.client_phone;


        const cancel =
          document.createElement("button");

        cancel.className =
          "cancel";

        cancel.type =
          "button";

        cancel.textContent =
          "❌ Cancelar cita";


        cancel.addEventListener(
          "click",
          () => {

            cancelAppointment(
              appointment
            );

          }
        );


        card.appendChild(top);

        card.appendChild(client);

        card.appendChild(phone);

        card.appendChild(cancel);


        appointmentsContainer.appendChild(
          card
        );

      }
    );


  } catch (error) {

    appointmentsContainer.innerHTML =
      "";

    summary.textContent =
      "No se pudieron cargar las citas.";

    showError(
      error.message
    );

  }

}


/* =========================
   CANCELAR CITA
========================= */

async function cancelAppointment(
  appointment
) {

  const confirmed =
    confirm(
      `¿Cancelar la cita de ${appointment.client_name} a las ${formatTime(appointment.appointment_time)}?`
    );


  if (!confirmed) {
    return;
  }


  try {

    const response =
      await fetch(
        "/api/appointments",
        {
          method: "DELETE",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            id:
              appointment.id

          })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "No se pudo cancelar la cita."
      );

    }


    await loadAppointments();


  } catch (error) {

    showError(
      error.message
    );

  }

}


/* =========================
   EVENTOS
========================= */

dateInput.addEventListener(
  "change",
  loadAppointments
);


refreshButton.addEventListener(
  "click",
  loadAppointments
);


/* =========================
   INICIAR
========================= */

loadAppointments();

</script>

</body>
</html>
